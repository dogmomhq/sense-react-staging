<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Matchmaking</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --text-primary: #1A1A2E; --text-secondary: #6B7B94; --accent: #6C63FF; }
  html, body { height: 100%; font-family: 'Inter', -apple-system, sans-serif; color: var(--text-primary); overflow: hidden; -webkit-font-smoothing: antialiased; }
  .app { max-width: 430px; margin: 0 auto; height: 100%; display: flex; flex-direction: column; position: relative; overflow: hidden; }
  .bg-image { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 0; }
  .bg-image img { width: 100%; height: 100%; object-fit: cover; }

  .matchmaking-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1;
    position: relative;
    padding: 0 30px;
    gap: 24px;
  }

  .match-status {
    font-size: 18px;
    font-weight: 700;
    color: var(--text-primary);
    text-align: center;
    letter-spacing: 0.5px;
  }

  /* Spinner */
  .spinner {
    width: 80px;
    height: 80px;
    position: relative;
  }
  .spinner::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border: 5px solid rgba(0,0,0,0.06);
    border-radius: 50%;
  }
  .spinner::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    border: 5px solid transparent;
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .match-info {
    text-align: center;
  }
  .match-tier {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
  }
  .match-wager {
    font-size: 28px;
    font-weight: 800;
    color: var(--text-primary);
    margin-top: 4px;
  }

  .cancel-btn {
    padding: 12px 32px;
    background: transparent;
    color: var(--text-secondary);
    border: 2px solid rgba(0,0,0,0.12);
    border-radius: 50px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .bottom-nav { display: flex; justify-content: space-around; align-items: center; padding: 10px 0 18px; background: #FFF; border-top: 1px solid rgba(0,0,0,0.06); z-index: 2; position: relative; flex-shrink: 0; }
  .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; flex: 1; color: #2A2A2A; }
  .nav-icon { width: 24px; height: 24px; }
  .nav-label { font-size: 10px; font-weight: 700; }
  @supports (padding-top: env(safe-area-inset-top)) { .bottom-nav { padding-bottom: calc(env(safe-area-inset-bottom) + 8px); } }
</style>
</head>
<body>
<div class="app">
  <div class="bg-image"><img src="assets/background.jpg" alt=""></div>

  <div class="matchmaking-content">
    <div class="match-status">Finding opponent...</div>
    <div class="spinner"></div>
    <div class="match-info">
      <div class="match-tier">Wager</div>
      <div class="match-wager">$1.00</div>
    </div>
    <button class="cancel-btn">Cancel</button>
  </div>

  <div class="bottom-nav">
    <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg><span class="nav-label">Play</span></div>
    <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="7" width="7" height="13" rx="1"/><rect x="15" y="3" width="7" height="17" rx="1"/><path d="M9 14h6"/><path d="M9 10h6"/></svg><span class="nav-label">Challenge</span></div>
    <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span class="nav-label">Profile</span></div>
    <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span class="nav-label">Hosts</span></div>
    <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg><span class="nav-label">History</span></div>
  </div>
</div>
</body>
</html>
