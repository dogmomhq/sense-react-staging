<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>COMMON SENSE — All Screens</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #111;
    color: #fff;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    padding: 24px 0 8px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2px;
    color: #fff;
  }
  .subtitle {
    text-align: center;
    font-size: 12px;
    color: #666;
    padding-bottom: 20px;
    letter-spacing: 1px;
  }
  .screens {
    display: flex;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    gap: 16px;
    padding: 0 20px 30px;
  }
  .screen-col {
    flex-shrink: 0;
    scroll-snap-align: start;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .screen-label {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 8px 0;
    color: #7B8DB8;
  }
  .screen-frame {
    width: 320px;
    height: 640px;
    border-radius: 20px;
    overflow: hidden;
    border: 2px solid #333;
    background: #fff;
  }
  .screen-frame iframe {
    width: 100%;
    height: 100%;
    border: none;
    transform-origin: 0 0;
  }

  /* On mobile, make frames larger */
  @media (max-width: 600px) {
    .screens {
      gap: 12px;
      padding: 0 12px 24px;
    }
    .screen-frame {
      width: 280px;
      height: 560px;
    }
  }

  /* Scrollbar styling */
  .screens::-webkit-scrollbar { height: 6px; }
  .screens::-webkit-scrollbar-track { background: #222; border-radius: 3px; }
  .screens::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
</style>
</head>
<body>
  <h1>COMMON SENSE</h1>
  <p class="subtitle">REDESIGN PREVIEW — SCROLL TO SEE ALL SCREENS</p>

  <div class="screens">
    <div class="screen-col">
      <div class="screen-label">LANDING</div>
      <div class="screen-frame">
        <iframe src="mockup.html?v=5" loading="lazy"></iframe>
      </div>
    </div>

    <div class="screen-col">
      <div class="screen-label">QUESTION</div>
      <div class="screen-frame">
        <iframe src="question.html?v=5" loading="lazy"></iframe>
      </div>
    </div>

    <div class="screen-col">
      <div class="screen-label">RESULTS — WIN</div>
      <div class="screen-frame">
        <iframe src="results.html?v=5" loading="lazy"></iframe>
      </div>
    </div>
  </div>
</body>
</html>
