<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Sense — All Screens</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #0F0F13; color: #fff; min-height: 100vh; }
  .header { padding: 32px 40px 20px; }
  .header h1 { font-size: 28px; font-weight: 900; letter-spacing: -0.5px; }
  .header p { font-size: 14px; color: #888; margin-top: 4px; }
  .gallery { display: flex; gap: 28px; padding: 12px 40px 40px; overflow-x: auto; -webkit-overflow-scrolling: touch; scroll-snap-type: x mandatory; }
  .gallery::-webkit-scrollbar { height: 6px; }
  .gallery::-webkit-scrollbar-track { background: #1a1a1f; border-radius: 3px; }
  .gallery::-webkit-scrollbar-thumb { background: #6C63FF; border-radius: 3px; }
  .screen-card { flex-shrink: 0; scroll-snap-align: start; }
  .screen-label { font-size: 13px; font-weight: 700; color: #aaa; margin-bottom: 10px; text-align: center; letter-spacing: 1px; text-transform: uppercase; }
  .phone-frame {
    width: 375px; height: 812px;
    border-radius: 40px;
    overflow: hidden;
    border: 3px solid #2a2a2f;
    background: #fff;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  .phone-frame iframe { width: 100%; height: 100%; border: none; }
  @media (max-width: 600px) {
    .header { padding: 20px 16px 12px; }
    .header h1 { font-size: 22px; }
    .gallery { padding: 8px 16px 24px; gap: 16px; }
    .phone-frame { width: 320px; height: 693px; border-radius: 34px; }
  }
</style>
</head>
<body>
<div class="header">
  <h1>COMMON SENSE — All Screens</h1>
  <p>Scroll to see all 8 screens. Design preview — not functional.</p>
</div>
<div class="gallery">
  <div class="screen-card">
    <div class="screen-label">1. Landing</div>
    <div class="phone-frame"><iframe src="mockup.html?v=5"></iframe></div>
  </div>
  <div class="screen-card">
    <div class="screen-label">2. Matchmaking</div>
    <div class="phone-frame"><iframe src="matchmaking.html?v=1"></iframe></div>
  </div>
  <div class="screen-card">
    <div class="screen-label">3. Question</div>
    <div class="phone-frame"><iframe src="question.html?v=5"></iframe></div>
  </div>
  <div class="screen-card">
    <div class="screen-label">4. Result — Win</div>
    <div class="phone-frame"><iframe src="results.html?v=5"></iframe></div>
  </div>
  <div class="screen-card">
    <div class="screen-label">5. Result — Loss</div>
    <div class="phone-frame"><iframe src="results-loss.html?v=1"></iframe></div>
  </div>
  <div class="screen-card">
    <div class="screen-label">6. Result — Draw</div>
    <div class="phone-frame"><iframe src="results-draw.html?v=1"></iframe></div>
  </div>
  <div class="screen-card">
    <div class="screen-label">7. Leaderboard</div>
    <div class="phone-frame"><iframe src="leaderboard.html?v=1"></iframe></div>
  </div>
  <div class="screen-card">
    <div class="screen-label">8. Profile</div>
    <div class="phone-frame"><iframe src="profile.html?v=1"></iframe></div>
  </div>
</div>
</body>
</html>
