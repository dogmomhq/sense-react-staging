<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>COMMON SENSE — Landing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    /* Warm cream background matching target exactly */
    --bg: #E6E1DB;
    --bg-card: #FFFFFF;
    /* Muted steel-lavender accent — matches target buttons */
    --accent: #7B8DB8;
    --accent-light: #97A8C9;
    --text-primary: #1A1A2E;
    --text-secondary: #6B7B94;
    --border-accent: #A0AEC0;
  }

  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 430px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg);
    overflow: hidden;
  }

  /* ============================================
     BACKGROUND PATTERN — Large chevron shapes
     matching the target's geometric overlay
     ============================================ */
  .bg-pattern {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  /* Large chevron pointing left — positioned center-bottom */
  .bg-pattern::before {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    top: 35%;
    left: -80px;
    background: linear-gradient(135deg, transparent 48%, rgba(123,141,184,0.08) 48%, rgba(123,141,184,0.08) 52%, transparent 52%),
                linear-gradient(225deg, transparent 48%, rgba(123,141,184,0.08) 48%, rgba(123,141,184,0.08) 52%, transparent 52%);
    transform: scale(1.3);
  }
  /* Second chevron — offset right */
  .bg-pattern::after {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    top: 25%;
    right: -120px;
    background: linear-gradient(135deg, transparent 48%, rgba(123,141,184,0.06) 48%, rgba(123,141,184,0.06) 52%, transparent 52%),
                linear-gradient(225deg, transparent 48%, rgba(123,141,184,0.06) 48%, rgba(123,141,184,0.06) 52%, transparent 52%);
    transform: scale(1.5);
  }

  /* ============================================
     TOP BAR — username left, balance+add right
     ============================================ */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    z-index: 2;
    position: relative;
  }
  .username {
    font-weight: 800;
    font-size: 17px;
    color: var(--text-primary);
    letter-spacing: -0.2px;
  }
  .balance-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .balance {
    font-weight: 700;
    font-size: 17px;
    color: var(--text-primary);
  }
  .add-btn {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: none;
    border: 2.5px solid var(--accent);
    color: var(--accent);
    font-size: 18px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    line-height: 1;
  }

  /* ============================================
     HERO BANNER — lion photo with text overlay
     Dark moody with blue-purple tint
     ============================================ */
  .hero-banner {
    position: relative;
    width: 100%;
    aspect-ratio: 390 / 200;
    overflow: hidden;
    z-index: 1;
    flex-shrink: 0;
  }
  .hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
    /* Dark moody blue-purple tint matching target */
    filter: brightness(0.38) contrast(1.2) saturate(0.7);
  }
  .hero-color-overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    /* Blue-purple tint overlay to match target's color cast */
    background: linear-gradient(
      180deg,
      rgba(25, 20, 50, 0.35) 0%,
      rgba(20, 18, 45, 0.50) 100%
    );
    mix-blend-mode: multiply;
  }
  .hero-text-container {
    position: absolute;
    bottom: 0; left: 0; right: 0; top: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 22px;
    z-index: 2;
  }
  .hero-title-common {
    font-size: 56px;
    font-weight: 900;
    color: #FFFFFF;
    line-height: 0.88;
    letter-spacing: -1.5px;
    /* Heavy dark outline stroke like the target */
    -webkit-text-stroke: 3px rgba(0,0,0,0.7);
    paint-order: stroke fill;
    text-shadow:
      0 2px 6px rgba(0,0,0,0.6),
      0 0 30px rgba(0,0,0,0.3);
  }
  .hero-title-sense {
    font-size: 56px;
    font-weight: 900;
    color: var(--accent-light);
    line-height: 0.88;
    letter-spacing: -1.5px;
    margin-top: 2px;
    /* Heavy dark outline stroke like the target */
    -webkit-text-stroke: 3px rgba(0,0,0,0.6);
    paint-order: stroke fill;
    text-shadow:
      0 2px 6px rgba(0,0,0,0.5),
      0 0 30px rgba(0,0,0,0.2),
      /* subtle outer glow in accent color */
      0 0 15px rgba(151, 168, 201, 0.3);
  }

  /* ============================================
     MAIN CONTENT — stepper, play, practice
     ============================================ */
  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 28px;
    gap: 20px;
    z-index: 1;
    position: relative;
  }

  /* --- Wager Stepper --- */
  .wager-stepper {
    display: flex;
    align-items: center;
    background: var(--bg-card);
    border-radius: 16px;
    padding: 6px;
    box-shadow:
      0 2px 8px rgba(0,0,0,0.06),
      0 0 0 1px rgba(0,0,0,0.04);
    width: 240px;
    justify-content: space-between;
  }
  .stepper-btn {
    width: 48px;
    height: 42px;
    border-radius: 11px;
    background: var(--accent);
    border: none;
    color: white;
    font-size: 24px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: background 0.15s;
  }
  .stepper-btn:active { background: #6A7CA7; }
  .wager-amount {
    font-size: 28px;
    font-weight: 700;
    color: var(--text-primary);
    letter-spacing: -0.5px;
    min-width: 70px;
    text-align: center;
  }

  /* --- Play Now Button --- */
  .play-now-btn {
    width: 85%;
    padding: 18px 0;
    background: #111111;
    color: #FFFFFF;
    border: none;
    border-radius: 50px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 2.5px;
    cursor: pointer;
    text-transform: uppercase;
    transition: transform 0.1s;
  }
  .play-now-btn:active { transform: scale(0.97); }

  /* --- Practice Mode Button --- */
  .practice-btn {
    width: 62%;
    padding: 13px 0;
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--border-accent);
    border-radius: 50px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.3px;
  }

  /* ============================================
     BOTTOM NAV — 5 tabs with icons
     ============================================ */
  .bottom-nav {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 10px 0 18px;
    background: #FFFFFF;
    border-top: 1px solid rgba(0,0,0,0.06);
    z-index: 2;
    position: relative;
    flex-shrink: 0;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    flex: 1;
    color: var(--text-secondary);
  }
  .nav-item.active { color: var(--accent); }
  .nav-icon { width: 22px; height: 22px; }
  .nav-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2px;
  }

  /* Safe area for notched phones */
  @supports (padding-top: env(safe-area-inset-top)) {
    .top-bar { padding-top: calc(env(safe-area-inset-top) + 6px); }
    .bottom-nav { padding-bottom: calc(env(safe-area-inset-bottom) + 8px); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="bg-pattern"></div>

  <!-- Top bar -->
  <div class="top-bar">
    <div class="username">FastLynx69</div>
    <div class="balance-row">
      <div class="balance">$11.36</div>
      <button class="add-btn">+</button>
    </div>
  </div>

  <!-- Hero banner -->
  <div class="hero-banner">
    <img class="hero-img" src="https://images.unsplash.com/photo-1614027164847-1b28cfe1df60?w=800&q=80" alt="Lion" crossorigin="anonymous">
    <div class="hero-color-overlay"></div>
    <div class="hero-text-container">
      <div class="hero-title-common">COMMON</div>
      <div class="hero-title-sense">SENSE</div>
    </div>
  </div>

  <!-- Main content -->
  <div class="main-content">
    <div class="wager-stepper">
      <button class="stepper-btn" id="stepDown">−</button>
      <div class="wager-amount" id="wagerDisplay">$1</div>
      <button class="stepper-btn" id="stepUp">+</button>
    </div>
    <button class="play-now-btn">PLAY NOW</button>
    <button class="practice-btn">Practice Mode</button>
  </div>

  <!-- Bottom nav -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span class="nav-label">Play</span>
    </div>
    <div class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="7" height="13" rx="1"/><rect x="15" y="3" width="7" height="17" rx="1"/><path d="M9 14h6"/><path d="M9 10h6"/></svg>
      <span class="nav-label">Challenge</span>
    </div>
    <div class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="nav-label">Profile</span>
    </div>
    <div class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="nav-label">Hosts</span>
    </div>
    <div class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span class="nav-label">History</span>
    </div>
  </div>
</div>

<script>
  const tiers = ['$0.10', '$1', '$10', '$100'];
  let tierIdx = 1;
  const display = document.getElementById('wagerDisplay');
  document.getElementById('stepDown').addEventListener('click', () => {
    tierIdx = Math.max(0, tierIdx - 1);
    display.textContent = tiers[tierIdx];
  });
  document.getElementById('stepUp').addEventListener('click', () => {
    tierIdx = Math.min(tiers.length - 1, tierIdx + 1);
    display.textContent = tiers[tierIdx];
  });
</script>
</body>
</html>
