<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Design Compare — Landing v4</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #1a1a1a;
    color: #fff;
    height: 100vh;
    overflow: hidden;
  }
  .toggle-bar {
    display: flex;
    justify-content: center;
    gap: 0;
    padding: 8px 16px;
    background: #111;
    z-index: 10;
    position: relative;
  }
  .toggle-btn {
    flex: 1;
    max-width: 160px;
    padding: 10px 0;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    background: #333;
    color: #888;
  }
  .toggle-btn:first-child { border-radius: 8px 0 0 8px; }
  .toggle-btn:last-child { border-radius: 0 8px 8px 0; }
  .toggle-btn.on { background: #7B8DB8; color: #fff; }
  .toggle-btn.on-target { background: #E85D4A; color: #fff; }

  .compare-container {
    display: flex;
    height: calc(100vh - 50px);
  }
  .panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow: hidden;
  }
  .panel-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 6px 0 4px;
  }
  .panel-label.target { color: #E85D4A; }
  .panel-label.build { color: #7B8DB8; }
  .panel-frame {
    flex: 1;
    width: 100%;
    display: flex;
    justify-content: center;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .panel-frame img {
    width: 100%;
    max-width: 390px;
    height: auto;
    display: block;
  }
  .panel-frame iframe {
    width: 390px;
    height: 100%;
    border: none;
  }
  .divider { width: 2px; background: #333; flex-shrink: 0; }

  @media (max-width: 800px) {
    .toggle-bar { display: flex; }
    .divider { display: none; }
    .compare-container { display: block; height: calc(100vh - 50px); }
    .panel {
      position: absolute;
      top: 50px; left: 0; right: 0; bottom: 0;
      transition: opacity 0.2s;
    }
    .panel.hidden { opacity: 0; pointer-events: none; }
    .panel-frame iframe { width: 100%; max-width: 430px; }
    .panel-frame img { max-width: 430px; }
  }
  @media (min-width: 801px) {
    .toggle-bar { display: none; }
    .panel.hidden { opacity: 1; pointer-events: all; }
  }
</style>
</head>
<body>
<div class="toggle-bar">
  <button class="toggle-btn on-target" id="btnTarget" onclick="show('target')">TARGET</button>
  <button class="toggle-btn" id="btnBuild" onclick="show('build')">BUILD</button>
</div>
<div class="compare-container">
  <div class="panel" id="panelTarget">
    <div class="panel-label target">TARGET</div>
    <div class="panel-frame">
      <img src="design-target.jpg?v=4" alt="Design Target">
    </div>
  </div>
  <div class="divider"></div>
  <div class="panel hidden" id="panelBuild">
    <div class="panel-label build">BUILD</div>
    <div class="panel-frame">
      <iframe src="mockup.html?v=4"></iframe>
    </div>
  </div>
</div>
<script>
function show(w) {
  const t = document.getElementById('panelTarget');
  const b = document.getElementById('panelBuild');
  const bt = document.getElementById('btnTarget');
  const bb = document.getElementById('btnBuild');
  if (w === 'target') {
    t.classList.remove('hidden'); b.classList.add('hidden');
    bt.className = 'toggle-btn on-target'; bb.className = 'toggle-btn';
  } else {
    b.classList.remove('hidden'); t.classList.add('hidden');
    bt.className = 'toggle-btn'; bb.className = 'toggle-btn on';
  }
}
let sx=0;
document.addEventListener('touchstart', e => sx = e.touches[0].clientX);
document.addEventListener('touchend', e => {
  const d = e.changedTouches[0].clientX - sx;
  if (Math.abs(d) > 60) show(d > 0 ? 'target' : 'build');
});
</script>
</body>
</html>
