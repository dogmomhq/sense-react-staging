<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SENSE — Countdown Race Reveals</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f0f0f3;color:#1A1A2E;min-height:100vh;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f0f0f3;--card:rgba(255,255,255,0.85);--accent:#6C63FF;--accent-dark:#5A52E0;
  --win:#22C55E;--lose:#EF4444;--draw:#F59E0B;--text:#1A1A2E;--text2:#6B7B94;
  --border:rgba(0,0,0,0.06);--radius:16px;
}
.page-header{text-align:center;padding:16px 16px 4px;font-size:12px;color:var(--text2);font-weight:700;letter-spacing:2px;text-transform:uppercase;}
.page-sub{text-align:center;padding:0 16px 12px;font-size:11px;color:var(--text2);font-weight:500;}

.scenario{
  margin:8px 12px 20px;background:var(--card);border-radius:var(--radius);
  border:1px solid var(--border);backdrop-filter:blur(8px);overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,0.04);
}
.scenario-header{
  padding:10px 14px 8px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.scenario-title{font-size:13px;font-weight:700;}
.scenario-tag{font-size:10px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:6px;color:#fff;}
.tag-win{background:var(--win)}.tag-lose{background:var(--lose)}.tag-draw{background:var(--draw)}

.stage{
  position:relative;height:380px;overflow:hidden;background:#fafafa;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}

.controls{display:flex;gap:6px;padding:10px 14px;border-top:1px solid var(--border);}
.btn-play{
  flex:1;padding:10px;border:none;border-radius:10px;font-weight:700;font-size:13px;
  cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:1px;
  background:var(--accent);color:#fff;transition:transform 0.1s;
}
.btn-play:active{transform:scale(0.96)}
.btn-reset{
  width:40px;background:var(--bg);border:1px solid var(--border);border-radius:10px;
  cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;
}

.idle-text{color:var(--text2);font-size:13px;font-weight:500;letter-spacing:1px;}

/* Shared animation styles */
.answer-card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:10px 16px;width:calc(100% - 32px);text-align:left;
}
.answer-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;}
.answer-label{font-size:10px;font-weight:700;color:var(--text2);letter-spacing:1px;}
.answer-val{font-size:14px;font-weight:700;}
.answer-time{font-size:12px;color:var(--text2);font-weight:500;margin-left:8px;}
.answer-divider{height:1px;background:var(--border);margin:3px 0;}
.correct-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;}

.result-banner{font-size:26px;font-weight:900;letter-spacing:2px;text-align:center;margin-top:12px;}
.result-payout{font-size:34px;font-weight:900;text-align:center;margin:6px 0 2px;}
.result-payout-label{font-size:11px;color:var(--text2);text-align:center;font-weight:500;margin-bottom:8px;}
.result-stats{display:flex;justify-content:center;gap:24px;margin-top:6px;}
.result-stat{text-align:center;}
.stat-num{font-size:20px;font-weight:800;display:block;}
.stat-label{font-size:9px;font-weight:700;color:var(--text2);letter-spacing:1px;}

/* Particles */
.particle{position:absolute;pointer-events:none;animation:pfall linear forwards;}
@keyframes pfall{0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(0.2)}}

/* Shake */
@keyframes shake{0%,100%{transform:translateX(0)}10%{transform:translateX(-8px) rotate(-0.5deg)}20%{transform:translateX(8px) rotate(0.5deg)}30%{transform:translateX(-5px)}40%{transform:translateX(5px)}50%{transform:translateX(-2px)}60%{transform:translateX(2px)}}
.shaking{animation:shake 0.5s ease-out}

/* Flash */
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:20}
.flash.go{animation:flashPop 0.4s ease-out forwards}
@keyframes flashPop{0%{opacity:0.7}100%{opacity:0}}

/* Shockwave */
.shockwave{position:absolute;border-radius:50%;pointer-events:none;border:3px solid;opacity:0;z-index:15}
.shockwave.go{animation:swExpand 0.8s ease-out forwards}
@keyframes swExpand{0%{transform:scale(0.1);opacity:0.8}100%{transform:scale(4);opacity:0}}
</style>
</head>
<body>

<div class="page-header">COUNTDOWN RACE — ALL SCENARIOS</div>
<div class="page-sub">Tap PLAY to watch each scenario unfold</div>
<div id="scenarios"></div>

<script>
const SCENARIOS = [
  {
    id: 'win-both-correct',
    title: 'Win — Both Correct, You Faster',
    tag: 'WIN', tagClass: 'tag-win',
    data: {
      myAnswer:'Red Fox', myCorrect:true, myTime:2.31,
      oppAnswer:'Red Fox', oppCorrect:true, oppTime:3.14,
      correctAnswer:'Red Fox', opponent:'PLAYER_42',
      payout:'2.00', wager:'1.00', result:'win',
      banner:"LET'S GO", stats:{wins:5,draws:1,losses:2}
    }
  },
  {
    id: 'win-opp-wrong',
    title: 'Win — You Correct, They Wrong',
    tag: 'WIN', tagClass: 'tag-win',
    data: {
      myAnswer:'Red Fox', myCorrect:true, myTime:3.50,
      oppAnswer:'Arctic Fox', oppCorrect:false, oppTime:2.10,
      correctAnswer:'Red Fox', opponent:'SPEEDSTER',
      payout:'2.00', wager:'1.00', result:'win',
      banner:"BUILT DIFFERENT", stats:{wins:6,draws:1,losses:2}
    }
  },
  {
    id: 'win-close',
    title: 'Win — Photo Finish (0.03s gap)',
    tag: 'WIN', tagClass: 'tag-win',
    data: {
      myAnswer:'Bengal Tiger', myCorrect:true, myTime:1.87,
      oppAnswer:'Bengal Tiger', oppCorrect:true, oppTime:1.90,
      correctAnswer:'Bengal Tiger', opponent:'RIVAL_X',
      payout:'2.00', wager:'1.00', result:'win',
      banner:"TOO FAST", stats:{wins:7,draws:1,losses:2}
    }
  },
  {
    id: 'lose-both-correct',
    title: 'Lose — Both Correct, They Faster',
    tag: 'LOSE', tagClass: 'tag-lose',
    data: {
      myAnswer:'Red Fox', myCorrect:true, myTime:3.14,
      oppAnswer:'Red Fox', oppCorrect:true, oppTime:2.31,
      correctAnswer:'Red Fox', opponent:'PLAYER_42',
      payout:'0', wager:'1.00', result:'lose',
      banner:"ALMOST HAD IT", stats:{wins:5,draws:1,losses:3}
    }
  },
  {
    id: 'lose-you-wrong',
    title: 'Lose — You Wrong, They Correct',
    tag: 'LOSE', tagClass: 'tag-lose',
    data: {
      myAnswer:'Arctic Fox', myCorrect:false, myTime:2.10,
      oppAnswer:'Red Fox', oppCorrect:true, oppTime:3.50,
      correctAnswer:'Red Fox', opponent:'BRAINIAC',
      payout:'0', wager:'1.00', result:'lose',
      banner:"NEXT ONE'S YOURS", stats:{wins:5,draws:1,losses:4}
    }
  },
  {
    id: 'lose-close',
    title: 'Lose — Photo Finish (0.03s gap)',
    tag: 'LOSE', tagClass: 'tag-lose',
    data: {
      myAnswer:'Bengal Tiger', myCorrect:true, myTime:1.90,
      oppAnswer:'Bengal Tiger', oppCorrect:true, oppTime:1.87,
      correctAnswer:'Bengal Tiger', opponent:'RIVAL_X',
      payout:'0', wager:'1.00', result:'lose',
      banner:"CLOSE ONE", stats:{wins:5,draws:1,losses:3}
    }
  },
  {
    id: 'draw-both-correct',
    title: 'Draw — Same Answer, Same Time',
    tag: 'DRAW', tagClass: 'tag-draw',
    data: {
      myAnswer:'Red Fox', myCorrect:true, myTime:2.50,
      oppAnswer:'Red Fox', oppCorrect:true, oppTime:2.50,
      correctAnswer:'Red Fox', opponent:'TWIN',
      payout:'1.00', wager:'1.00', result:'draw',
      banner:"DEAD HEAT", stats:{wins:5,draws:2,losses:3}
    }
  },
  {
    id: 'draw-both-wrong',
    title: 'Draw — Both Wrong',
    tag: 'DRAW', tagClass: 'tag-draw',
    data: {
      myAnswer:'Arctic Fox', myCorrect:false, myTime:3.20,
      oppAnswer:'Gray Wolf', oppCorrect:false, oppTime:2.80,
      correctAnswer:'Red Fox', opponent:'GUESSER',
      payout:'1.00', wager:'1.00', result:'draw',
      banner:"STALEMATE", stats:{wins:5,draws:3,losses:3}
    }
  },
  {
    id: 'draw-both-timeout',
    title: 'Draw — Both Timed Out',
    tag: 'DRAW', tagClass: 'tag-draw',
    data: {
      myAnswer:'Timed out', myCorrect:false, myTime:null,
      oppAnswer:'Timed out', oppCorrect:false, oppTime:null,
      correctAnswer:'Red Fox', opponent:'AFK_ANDY',
      payout:'1.00', wager:'1.00', result:'draw',
      banner:"STALEMATE", stats:{wins:5,draws:4,losses:3}
    }
  },
];

const container = document.getElementById('scenarios');
SCENARIOS.forEach(s => {
  const div = document.createElement('div');
  div.className = 'scenario';
  div.innerHTML = `
    <div class="scenario-header">
      <span class="scenario-title">${s.title}</span>
      <span class="scenario-tag ${s.tagClass}">${s.tag}</span>
    </div>
    <div class="stage" id="stage-${s.id}"><span class="idle-text">TAP PLAY</span></div>
    <div class="controls">
      <button class="btn-play" onclick="runScenario('${s.id}')">PLAY</button>
      <button class="btn-reset" onclick="resetScenario('${s.id}')">↺</button>
    </div>
  `;
  container.appendChild(div);
});

function resetScenario(id) {
  const stage = document.getElementById(`stage-${id}`);
  stage.innerHTML = '<span class="idle-text">TAP PLAY</span>';
  stage.className = 'stage';
}

function runScenario(id) {
  const s = SCENARIOS.find(x => x.id === id);
  const stage = document.getElementById(`stage-${id}`);
  stage.innerHTML = '';
  stage.className = 'stage';
  countdownRace(stage, s.data, id);
}

// ── Helpers ──
function spawnConfetti(stage, count, type) {
  const palettes = {
    win:['#22C55E','#6C63FF','#F59E0B','#00D4AA','#fff','#34D399','#A78BFA'],
    lose:['#EF4444','#991B1B','#6B7B94','#bbb'],
    draw:['#F59E0B','#FBBF24','#6B7B94','#ddd','#fff']
  };
  const colors = palettes[type] || palettes.draw;
  for(let i=0;i<count;i++){
    const p=document.createElement('div');p.className='particle';
    const size=3+Math.random()*7;
    const dx=(Math.random()-0.5)*320;
    const dy=-(60+Math.random()*280);
    const rot=Math.random()*720-360;
    p.style.cssText=`width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};left:50%;top:50%;--dx:${dx}px;--dy:${dy}px;--rot:${rot}deg;animation-duration:${0.7+Math.random()*0.7}s;animation-delay:${Math.random()*0.15}s;border-radius:${Math.random()>0.5?'50%':'2px'};`;
    stage.appendChild(p);
  }
}
function flashScreen(stage,color){
  const f=document.createElement('div');f.className='flash';f.style.background=color;
  stage.appendChild(f);requestAnimationFrame(()=>f.classList.add('go'));
}
function shockwave(stage,color){
  const s=document.createElement('div');s.className='shockwave';
  s.style.cssText=`width:60px;height:60px;left:calc(50% - 30px);top:calc(50% - 30px);border-color:${color};`;
  stage.appendChild(s);requestAnimationFrame(()=>s.classList.add('go'));
}

function showFinalDetails(stage, d, delay) {
  setTimeout(() => {
    const color = d.result==='win'?'var(--win)':d.result==='lose'?'var(--lose)':'var(--draw)';
    const payText = d.result==='win'?`+$${d.payout}`:d.result==='draw'?`$${d.payout} returned`:`-$${d.wager}`;
    const payLabel = d.result==='win'?'won':d.result==='draw'?'returned':'lost';

    const wrap = document.createElement('div');
    wrap.style.cssText='width:100%;opacity:0;transform:translateY(20px);transition:all 0.4s cubic-bezier(0.0,0.0,0.2,1);position:relative;z-index:10;';
    wrap.innerHTML = `
      <div class="result-payout" style="color:${color}">${payText}</div>
      <div class="result-payout-label">${payLabel}</div>
      <div class="answer-card" style="margin:8px 16px;width:calc(100% - 32px);">
        <div class="answer-row">
          <span class="answer-label">YOU</span>
          <span><span class="answer-val" style="color:${d.myCorrect?'var(--win)':'var(--lose)'}">${d.myAnswer}</span>${d.myTime!=null?`<span class="answer-time">${d.myTime}s</span>`:''}</span>
        </div>
        <div class="answer-divider"></div>
        <div class="answer-row">
          <span class="answer-label">${d.opponent}</span>
          <span><span class="answer-val" style="color:${d.oppCorrect?'var(--win)':'var(--lose)'}">${d.oppAnswer}</span>${d.oppTime!=null?`<span class="answer-time">${d.oppTime}s</span>`:''}</span>
        </div>
        <div class="answer-divider"></div>
        <div class="correct-row">
          <span class="answer-label">CORRECT</span>
          <span class="answer-val" style="color:var(--win)">${d.correctAnswer}</span>
        </div>
      </div>
      <div class="result-stats">
        <div class="result-stat"><span class="stat-num" style="color:var(--win)">${d.stats.wins}</span><span class="stat-label">WINS</span></div>
        <div class="result-stat"><span class="stat-num" style="color:var(--draw)">${d.stats.draws}</span><span class="stat-label">DRAWS</span></div>
        <div class="result-stat"><span class="stat-num" style="color:var(--lose)">${d.stats.losses}</span><span class="stat-label">LOSSES</span></div>
      </div>
    `;
    stage.appendChild(wrap);
    requestAnimationFrame(()=>{wrap.style.opacity='1';wrap.style.transform='translateY(0)';});
  }, delay);
}

// ── The Countdown Race ──
function countdownRace(stage, d, id) {
  const isWin = d.result === 'win';
  const isDraw = d.result === 'draw';
  const bothCorrect = d.myCorrect && d.oppCorrect;
  const bothWrong = !d.myCorrect && !d.oppCorrect;
  const bothTimeout = d.myAnswer === 'Timed out' && d.oppAnswer === 'Timed out';
  const resultColor = isWin?'var(--win)':isDraw?'var(--draw)':'var(--lose)';
  const rawColor = isWin?'#22C55E':isDraw?'#F59E0B':'#EF4444';

  // ── PHASE 1: ANSWERS ──
  const p1 = document.createElement('div');
  p1.style.cssText = 'position:relative;z-index:5;text-align:center;width:100%;padding:0 20px;';

  // Your answer appears first
  const youBlock = document.createElement('div');
  youBlock.style.cssText = 'opacity:0;transform:translateY(16px);transition:all 0.4s cubic-bezier(0.0,0.0,0.2,1);margin-bottom:16px;';
  youBlock.innerHTML = `
    <div style="font-size:10px;color:var(--text2);font-weight:700;letter-spacing:2px;margin-bottom:6px">YOUR ANSWER</div>
    <div style="font-size:24px;font-weight:900;color:${d.myCorrect?'var(--win)':'var(--lose)'}">${d.myAnswer}</div>
    <div style="font-size:12px;font-weight:700;color:${d.myCorrect?'var(--win)':'var(--lose)'};margin-top:2px;letter-spacing:1px">${d.myCorrect?'CORRECT':'WRONG'}</div>
  `;
  p1.appendChild(youBlock);

  // Divider
  const divLine = document.createElement('div');
  divLine.style.cssText = 'width:40px;height:2px;background:var(--border);margin:0 auto 16px;opacity:0;transition:opacity 0.3s 0.3s;';
  p1.appendChild(divLine);

  // Opponent answer — revealed with tension
  const oppBlock = document.createElement('div');
  oppBlock.style.cssText = 'opacity:0;transform:translateY(16px);transition:all 0.5s cubic-bezier(0.0,0.0,0.2,1);';
  oppBlock.innerHTML = `
    <div style="font-size:10px;color:var(--text2);font-weight:700;letter-spacing:2px;margin-bottom:6px">${d.opponent}</div>
    <div id="opp-reveal-${id}" style="font-size:24px;font-weight:900;filter:blur(12px);color:var(--text2);transition:filter 0.6s ease-out, color 0.3s">???</div>
    <div id="opp-status-${id}" style="font-size:12px;font-weight:700;margin-top:2px;letter-spacing:1px;color:var(--text2);opacity:0;transition:opacity 0.3s">...</div>
  `;
  p1.appendChild(oppBlock);
  stage.appendChild(p1);

  // Animate in your answer
  setTimeout(() => { youBlock.style.opacity='1'; youBlock.style.transform='translateY(0)'; }, 200);
  setTimeout(() => { divLine.style.opacity='1'; }, 500);
  // Show opponent block (still blurred)
  setTimeout(() => { oppBlock.style.opacity='1'; oppBlock.style.transform='translateY(0)'; }, 800);

  // Reveal opponent answer with deblur
  setTimeout(() => {
    const oppEl = document.getElementById(`opp-reveal-${id}`);
    const oppSt = document.getElementById(`opp-status-${id}`);
    oppEl.textContent = d.oppAnswer;
    oppEl.style.filter = 'blur(0)';
    oppEl.style.color = d.oppCorrect?'var(--win)':'var(--lose)';
    oppSt.textContent = d.oppCorrect?'CORRECT':'WRONG';
    oppSt.style.color = d.oppCorrect?'var(--win)':'var(--lose)';
    oppSt.style.opacity = '1';
  }, 1500);

  // ── PHASE 2: TIME RACE (if both correct) or QUICK RESOLVE ──
  if (bothCorrect && d.myTime != null && d.oppTime != null) {
    setTimeout(() => {
      // Shrink answers up
      p1.style.transition = 'all 0.4s cubic-bezier(0.0,0.0,0.2,1)';
      p1.style.transform = 'translateY(-50px) scale(0.65)';
      p1.style.opacity = '0.3';

      const race = document.createElement('div');
      race.style.cssText = 'position:relative;z-index:5;text-align:center;width:100%;padding:0 16px;opacity:0;transform:translateY(10px);transition:all 0.3s;';

      const sameTime = d.myTime === d.oppTime;

      race.innerHTML = `
        <div style="font-size:10px;color:var(--text2);font-weight:700;letter-spacing:2px;margin-bottom:16px">
          ${sameTime ? 'COMPARING TIMES...' : 'WHO WAS FASTER?'}
        </div>
        <div style="display:flex;justify-content:center;gap:16px;align-items:center;margin-bottom:16px;">
          <div style="flex:1;text-align:center;">
            <div style="font-size:10px;color:var(--text2);font-weight:700;margin-bottom:4px">YOU</div>
            <div id="rt1-${id}" style="font-size:32px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;line-height:1;">0.00<span style="font-size:14px;font-weight:600;color:var(--text2)">s</span></div>
          </div>
          <div style="font-size:16px;font-weight:900;color:var(--border)">vs</div>
          <div style="flex:1;text-align:center;">
            <div style="font-size:10px;color:var(--text2);font-weight:700;margin-bottom:4px">${d.opponent}</div>
            <div id="rt2-${id}" style="font-size:32px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;line-height:1;">0.00<span style="font-size:14px;font-weight:600;color:var(--text2)">s</span></div>
          </div>
        </div>
        <div style="height:6px;background:var(--border);border-radius:3px;overflow:hidden;position:relative;">
          <div id="bar1-${id}" style="position:absolute;left:0;top:0;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width 0.03s linear;"></div>
          <div id="bar2-${id}" style="position:absolute;right:0;top:0;height:100%;width:0;background:var(--lose);border-radius:3px;transition:width 0.03s linear;"></div>
        </div>
        <div id="gap-${id}" style="margin-top:10px;font-size:11px;color:var(--text2);font-weight:600;opacity:0;transition:opacity 0.2s;"></div>
      `;
      stage.appendChild(race);
      requestAnimationFrame(() => { race.style.opacity='1'; race.style.transform='translateY(0)'; });

      const t1El = document.getElementById(`rt1-${id}`);
      const t2El = document.getElementById(`rt2-${id}`);
      const bar1 = document.getElementById(`bar1-${id}`);
      const bar2 = document.getElementById(`bar2-${id}`);
      const gapEl = document.getElementById(`gap-${id}`);

      const maxTime = Math.max(d.myTime, d.oppTime);
      const minTime = Math.min(d.myTime, d.oppTime);
      const duration = 2000;
      const step = 25;
      let elapsed = 0;

      const ticker = setInterval(() => {
        elapsed += step;
        const progress = Math.min(elapsed / duration, 1);
        // Both count at same rate, but cap at their actual time
        const displayMax = maxTime * progress * 1.1; // slight overshoot for drama
        const t1 = Math.min(displayMax, d.myTime);
        const t2 = Math.min(displayMax, d.oppTime);
        t1El.innerHTML = `${t1.toFixed(2)}<span style="font-size:14px;font-weight:600;color:var(--text2)">s</span>`;
        t2El.innerHTML = `${t2.toFixed(2)}<span style="font-size:14px;font-weight:600;color:var(--text2)">s</span>`;
        bar1.style.width = `${(t1/maxTime)*48}%`;
        bar2.style.width = `${(t2/maxTime)*48}%`;

        // Show gap when one stops
        if (t1 >= d.myTime && t2 < d.oppTime) {
          const gap = (d.oppTime - d.myTime);
          gapEl.textContent = `+${gap.toFixed(2)}s gap`;
          gapEl.style.opacity = '1';
        } else if (t2 >= d.oppTime && t1 < d.myTime) {
          const gap = (d.myTime - d.oppTime);
          gapEl.textContent = `+${gap.toFixed(2)}s gap`;
          gapEl.style.opacity = '1';
        }

        // Vibration builds in final 30%
        if (progress > 0.7) {
          const intensity = (progress - 0.7) * 8;
          stage.style.transform = `translateX(${(Math.random()-0.5)*intensity*2.5}px)`;
        }

        if (elapsed >= duration) {
          clearInterval(ticker);
          stage.style.transform = '';
          t1El.innerHTML = `${d.myTime.toFixed(2)}<span style="font-size:14px;font-weight:600;color:var(--text2)">s</span>`;
          t2El.innerHTML = `${d.oppTime.toFixed(2)}<span style="font-size:14px;font-weight:600;color:var(--text2)">s</span>`;

          // Highlight winner's time
          if (d.myTime < d.oppTime) {
            t1El.style.color = 'var(--win)';
            t2El.style.color = 'var(--text2)';
            bar1.style.background = 'var(--win)';
          } else if (d.oppTime < d.myTime) {
            t2El.style.color = 'var(--win)';
            t1El.style.color = 'var(--text2)';
            bar2.style.background = 'var(--win)';
          } else {
            t1El.style.color = 'var(--draw)';
            t2El.style.color = 'var(--draw)';
            bar1.style.background = 'var(--draw)';
            bar2.style.background = 'var(--draw)';
            gapEl.textContent = 'EXACT SAME TIME';
            gapEl.style.opacity = '1';
            gapEl.style.color = 'var(--draw)';
          }

          // Pause for impact, then explode
          setTimeout(() => {
            race.remove();
            p1.remove();
            doExplosion(stage, d, rawColor, resultColor);
          }, 700);
        }
      }, step);
    }, 2400);
  } else {
    // No time race — one or both wrong, or timeout
    setTimeout(() => {
      p1.remove();
      doExplosion(stage, d, rawColor, resultColor);
    }, 2600);
  }
}

function doExplosion(stage, d, rawColor, resultColor) {
  const isWin = d.result === 'win';
  const isDraw = d.result === 'draw';

  if (isWin) {
    flashScreen(stage, 'rgba(34,197,94,0.35)');
    shockwave(stage, '#22C55E');
    setTimeout(() => shockwave(stage, '#6C63FF'), 100);
    stage.classList.add('shaking');
    spawnConfetti(stage, 50, 'win');
  } else if (isDraw) {
    flashScreen(stage, 'rgba(245,158,11,0.2)');
    shockwave(stage, '#F59E0B');
    spawnConfetti(stage, 20, 'draw');
  } else {
    flashScreen(stage, 'rgba(239,68,68,0.25)');
    shockwave(stage, '#EF4444');
    stage.classList.add('shaking');
    spawnConfetti(stage, 15, 'lose');
  }

  setTimeout(() => {
    const banner = document.createElement('div');
    banner.className = 'result-banner';
    banner.style.cssText = `color:${resultColor};position:relative;z-index:10;transform:scale(0);transition:transform 0.3s cubic-bezier(0.68,-0.55,0.265,1.55);`;
    banner.textContent = d.banner;
    stage.appendChild(banner);
    requestAnimationFrame(() => banner.style.transform = 'scale(1)');
    showFinalDetails(stage, d, 350);
  }, 150);
}

</script>
