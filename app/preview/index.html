<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SENSE — Countdown Race v2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:#f0f0f3;color:#1A1A2E;min-height:100vh;-webkit-tap-highlight-color:transparent;padding-bottom:60px;}
:root{
  --bg:#f0f0f3;--card:rgba(255,255,255,0.85);--accent:#6C63FF;--accent-dark:#5A52E0;
  --win:#22C55E;--lose:#EF4444;--draw:#F59E0B;--text:#1A1A2E;--text2:#6B7B94;
  --border:rgba(0,0,0,0.06);--radius:16px;
}
.page-header{text-align:center;padding:16px 16px 2px;font-size:11px;color:var(--text2);font-weight:700;letter-spacing:2px;text-transform:uppercase;}
.page-sub{text-align:center;padding:2px 16px 6px;font-size:10px;color:var(--text2);font-weight:500;}
.section-label{padding:12px 16px 4px;font-size:10px;font-weight:800;letter-spacing:2px;text-transform:uppercase;}
.section-label.win-s{color:var(--win)}.section-label.lose-s{color:var(--lose)}.section-label.draw-s{color:var(--draw)}

.scenario{
  margin:4px 10px 14px;background:var(--card);border-radius:var(--radius);
  border:1px solid var(--border);backdrop-filter:blur(8px);overflow:hidden;
  box-shadow:0 2px 12px rgba(0,0,0,0.04);
}
.scenario-header{
  padding:8px 12px 6px;border-bottom:1px solid var(--border);
  display:flex;justify-content:space-between;align-items:center;
}
.scenario-title{font-size:12px;font-weight:700;}
.scenario-tag{font-size:9px;font-weight:700;letter-spacing:1px;padding:2px 6px;border-radius:5px;color:#fff;}
.tag-win{background:var(--win)}.tag-lose{background:var(--lose)}.tag-draw{background:var(--draw)}

.stage{
  position:relative;height:380px;overflow:hidden;background:#fafafa;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}

.controls{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--border);}
.btn-play{
  flex:1;padding:9px;border:none;border-radius:10px;font-weight:700;font-size:12px;
  cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:1px;
  background:var(--accent);color:#fff;transition:transform 0.1s;
}
.btn-play:active{transform:scale(0.96)}
.btn-reset{
  width:36px;background:var(--bg);border:1px solid var(--border);border-radius:10px;
  cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;
}

.idle-text{color:var(--text2);font-size:12px;font-weight:500;letter-spacing:1px;}

.answer-card{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:8px 14px;width:calc(100% - 28px);text-align:left;
}
.answer-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;}
.answer-label{font-size:9px;font-weight:700;color:var(--text2);letter-spacing:1px;}
.answer-val{font-size:13px;font-weight:700;}
.answer-time{font-size:11px;color:var(--text2);font-weight:500;margin-left:6px;}
.answer-divider{height:1px;background:var(--border);margin:2px 0;}
.correct-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;}

.result-banner{font-size:24px;font-weight:900;letter-spacing:2px;text-align:center;margin-top:8px;position:relative;z-index:10;}
.result-payout{font-size:30px;font-weight:900;text-align:center;margin:4px 0 1px;}
.result-payout-label{font-size:10px;color:var(--text2);text-align:center;font-weight:500;margin-bottom:4px;}
.result-stats{display:flex;justify-content:center;gap:20px;margin-top:4px;}
.result-stat{text-align:center;}
.stat-num{font-size:18px;font-weight:800;display:block;}
.stat-label{font-size:8px;font-weight:700;color:var(--text2);letter-spacing:1px;}

/* Action buttons */
.action-btns{display:flex;gap:8px;padding:0 14px;margin-top:8px;width:100%;position:relative;z-index:10;}
.btn-rib{
  flex:1;padding:10px;border:none;border-radius:10px;font-weight:700;font-size:12px;
  cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:1px;
  background:#1A1A2E;color:#fff;
  background:linear-gradient(180deg,#2A2A3E 0%,#1A1A2E 100%);
  box-shadow:0 2px 8px rgba(0,0,0,0.2),inset 0 1px 0 rgba(255,255,255,0.1);
}
.btn-home{
  padding:10px 14px;border:1px solid var(--border);border-radius:10px;font-weight:600;font-size:12px;
  cursor:pointer;font-family:'Inter',sans-serif;color:var(--text2);background:var(--card);
}

/* Particles */
.particle{position:absolute;pointer-events:none;}
.confetti-up{animation:cupward ease-out forwards;}
@keyframes cupward{
  0%{opacity:1;transform:translate(0,0) rotate(0deg) scale(1)}
  60%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(0.3)}
}
.confetti-gravity{animation:cgravity ease-in forwards;}
@keyframes cgravity{
  0%{opacity:1;transform:translate(0,0) rotate(0deg)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot))}
}

/* Wrong stamp */
.wrong-stamp{
  position:absolute;font-size:60px;font-weight:900;color:var(--lose);
  opacity:0;transform:scale(3) rotate(-12deg);z-index:12;
  transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);pointer-events:none;
}
.wrong-stamp.slam{opacity:0.9;transform:scale(1) rotate(-12deg);}

/* Shake */
@keyframes shake{0%,100%{transform:translateX(0)}10%{transform:translateX(-8px) rotate(-0.5deg)}20%{transform:translateX(8px) rotate(0.5deg)}30%{transform:translateX(-5px)}40%{transform:translateX(5px)}50%{transform:translateX(-2px)}60%{transform:translateX(2px)}}
.shaking{animation:shake 0.5s ease-out}

/* Flash */
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:20}
.flash.go{animation:flashPop 0.35s ease-out forwards}
@keyframes flashPop{0%{opacity:0.85}100%{opacity:0}}

/* Shockwave */
.shockwave{position:absolute;border-radius:50%;pointer-events:none;border:3px solid;opacity:0;z-index:15}
.shockwave.go{animation:swExpand 0.7s ease-out forwards}
@keyframes swExpand{0%{transform:scale(0.1);opacity:0.8}100%{transform:scale(4);opacity:0}}

/* Red pulse for losses */
.red-pulse{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:14;background:radial-gradient(circle at center,rgba(239,68,68,0.3) 0%,transparent 70%)}
.red-pulse.go{animation:rpulse 0.8s ease-out forwards}
@keyframes rpulse{0%{opacity:0;transform:scale(0.5)}30%{opacity:1}100%{opacity:0;transform:scale(1.5)}}
</style>
</head>
<body>

<div class="page-header">COUNTDOWN RACE v2 — ALL SCENARIOS</div>
<div class="page-sub">13 scenarios — upgraded explosions, stamps, money counter, buttons</div>

<div class="section-label win-s">WINS (5)</div>
<div id="wins"></div>
<div class="section-label lose-s">LOSSES (5)</div>
<div id="losses"></div>
<div class="section-label draw-s">DRAWS (3)</div>
<div id="draws"></div>

<script>
const SCENARIOS = [
  {id:'w-blowout',section:'wins',title:'Blowout — You Dominated',tag:'WIN',tagClass:'tag-win',
    data:{myAnswer:'Red Fox',myCorrect:true,myTime:1.42,oppAnswer:'Red Fox',oppCorrect:true,oppTime:5.87,
      correctAnswer:'Red Fox',opponent:'SLOWPOKE',payout:'2.00',wager:'1.00',result:'win',
      banner:"DESTROYED",stats:{wins:8,draws:1,losses:2}}},
  {id:'w-comfortable',section:'wins',title:'Comfortable — Clear Gap',tag:'WIN',tagClass:'tag-win',
    data:{myAnswer:'Red Fox',myCorrect:true,myTime:2.31,oppAnswer:'Red Fox',oppCorrect:true,oppTime:3.14,
      correctAnswer:'Red Fox',opponent:'PLAYER_42',payout:'2.00',wager:'1.00',result:'win',
      banner:"LET'S GO",stats:{wins:5,draws:1,losses:2}}},
  {id:'w-photo',section:'wins',title:'Photo Finish — 0.03s Gap',tag:'WIN',tagClass:'tag-win',
    data:{myAnswer:'Bengal Tiger',myCorrect:true,myTime:1.87,oppAnswer:'Bengal Tiger',oppCorrect:true,oppTime:1.90,
      correctAnswer:'Bengal Tiger',opponent:'RIVAL_X',payout:'2.00',wager:'1.00',result:'win',
      banner:"BY A HAIR",stats:{wins:7,draws:1,losses:2}}},
  {id:'w-opp-wrong',section:'wins',title:'They Got It Wrong',tag:'WIN',tagClass:'tag-win',
    data:{myAnswer:'Red Fox',myCorrect:true,myTime:3.50,oppAnswer:'Arctic Fox',oppCorrect:false,oppTime:2.10,
      correctAnswer:'Red Fox',opponent:'SPEEDSTER',payout:'2.00',wager:'1.00',result:'win',
      banner:"BUILT DIFFERENT",stats:{wins:6,draws:1,losses:2}}},
  {id:'w-opp-timeout',section:'wins',title:'They Timed Out',tag:'WIN',tagClass:'tag-win',
    data:{myAnswer:'Red Fox',myCorrect:true,myTime:4.20,oppAnswer:'Timed out',oppCorrect:false,oppTime:null,
      correctAnswer:'Red Fox',opponent:'AFK_ANDY',payout:'2.00',wager:'1.00',result:'win',
      banner:"FREE MONEY",stats:{wins:9,draws:1,losses:2}}},
  {id:'l-blowout',section:'losses',title:'Blowout — Got Cooked',tag:'LOSE',tagClass:'tag-lose',
    data:{myAnswer:'Red Fox',myCorrect:true,myTime:5.87,oppAnswer:'Red Fox',oppCorrect:true,oppTime:1.42,
      correctAnswer:'Red Fox',opponent:'LIGHTNING',payout:'0',wager:'1.00',result:'lose',
      banner:"GOT COOKED",stats:{wins:5,draws:1,losses:5}}},
  {id:'l-comfortable',section:'losses',title:'Comfortable — Clear Gap',tag:'LOSE',tagClass:'tag-lose',
    data:{myAnswer:'Red Fox',myCorrect:true,myTime:3.14,oppAnswer:'Red Fox',oppCorrect:true,oppTime:2.31,
      correctAnswer:'Red Fox',opponent:'PLAYER_42',payout:'0',wager:'1.00',result:'lose',
      banner:"ALMOST HAD IT",stats:{wins:5,draws:1,losses:3}}},
  {id:'l-photo',section:'losses',title:'Photo Finish — 0.03s Gap',tag:'LOSE',tagClass:'tag-lose',
    data:{myAnswer:'Bengal Tiger',myCorrect:true,myTime:1.90,oppAnswer:'Bengal Tiger',oppCorrect:true,oppTime:1.87,
      correctAnswer:'Bengal Tiger',opponent:'RIVAL_X',payout:'0',wager:'1.00',result:'lose',
      banner:"SO CLOSE",stats:{wins:5,draws:1,losses:3}}},
  {id:'l-you-wrong',section:'losses',title:'You Got It Wrong',tag:'LOSE',tagClass:'tag-lose',
    data:{myAnswer:'Arctic Fox',myCorrect:false,myTime:2.10,oppAnswer:'Red Fox',oppCorrect:true,oppTime:3.50,
      correctAnswer:'Red Fox',opponent:'BRAINIAC',payout:'0',wager:'1.00',result:'lose',
      banner:"NEXT ONE'S YOURS",stats:{wins:5,draws:1,losses:4}}},
  {id:'l-you-timeout',section:'losses',title:'You Timed Out',tag:'LOSE',tagClass:'tag-lose',
    data:{myAnswer:'Timed out',myCorrect:false,myTime:null,oppAnswer:'Red Fox',oppCorrect:true,oppTime:3.20,
      correctAnswer:'Red Fox',opponent:'STILL_HERE',payout:'0',wager:'1.00',result:'lose',
      banner:"FELL ASLEEP",stats:{wins:5,draws:1,losses:5}}},
  {id:'d-same-time',section:'draws',title:'Both Correct, Exact Same Time',tag:'DRAW',tagClass:'tag-draw',
    data:{myAnswer:'Red Fox',myCorrect:true,myTime:2.50,oppAnswer:'Red Fox',oppCorrect:true,oppTime:2.50,
      correctAnswer:'Red Fox',opponent:'TWIN',payout:'1.00',wager:'1.00',result:'draw',
      banner:"DEAD HEAT",stats:{wins:5,draws:2,losses:3}}},
  {id:'d-both-wrong',section:'draws',title:'Both Wrong',tag:'DRAW',tagClass:'tag-draw',
    data:{myAnswer:'Arctic Fox',myCorrect:false,myTime:3.20,oppAnswer:'Gray Wolf',oppCorrect:false,oppTime:2.80,
      correctAnswer:'Red Fox',opponent:'GUESSER',payout:'1.00',wager:'1.00',result:'draw',
      banner:"STALEMATE",stats:{wins:5,draws:3,losses:3}}},
  {id:'d-both-timeout',section:'draws',title:'Both Timed Out',tag:'DRAW',tagClass:'tag-draw',
    data:{myAnswer:'Timed out',myCorrect:false,myTime:null,oppAnswer:'Timed out',oppCorrect:false,oppTime:null,
      correctAnswer:'Red Fox',opponent:'AFK_ANDY',payout:'1.00',wager:'1.00',result:'draw',
      banner:"NOBODY HOME",stats:{wins:5,draws:4,losses:3}}},
];

['wins','losses','draws'].forEach(sec=>{
  const container=document.getElementById(sec);
  SCENARIOS.filter(s=>s.section===sec).forEach(s=>{
    const div=document.createElement('div');div.className='scenario';
    div.innerHTML=`
      <div class="scenario-header">
        <span class="scenario-title">${s.title}</span>
        <span class="scenario-tag ${s.tagClass}">${s.tag}</span>
      </div>
      <div class="stage" id="stage-${s.id}"><span class="idle-text">TAP PLAY</span></div>
      <div class="controls">
        <button class="btn-play" onclick="runScenario('${s.id}')">PLAY</button>
        <button class="btn-reset" onclick="resetScenario('${s.id}')">↺</button>
      </div>`;
    container.appendChild(div);
  });
});

function resetScenario(id){
  const stage=document.getElementById(`stage-${id}`);
  stage.innerHTML='<span class="idle-text">TAP PLAY</span>';
  stage.className='stage';
}
function runScenario(id){
  const s=SCENARIOS.find(x=>x.id===id);
  const stage=document.getElementById(`stage-${id}`);
  stage.innerHTML='';stage.className='stage';
  countdownRace(stage,s.data,id);
}

// ── Haptic ──
function haptic(ms){try{navigator.vibrate&&navigator.vibrate(ms||15)}catch(e){}}

// ── Confetti cannon (shoots UP then gravity) ──
function spawnConfettiCannon(stage,count,type){
  const palettes={
    win:['#22C55E','#6C63FF','#F59E0B','#00D4AA','#fff','#34D399','#A78BFA','#EC4899'],
    lose:['#EF4444','#991B1B','#7F1D1D','#6B7B94'],
    draw:['#F59E0B','#FBBF24','#6B7B94','#ddd','#fff']
  };
  const colors=palettes[type]||palettes.draw;
  const stageRect=stage.getBoundingClientRect();
  for(let i=0;i<count;i++){
    const p=document.createElement('div');p.className='particle confetti-up';
    const size=4+Math.random()*8;
    const dx=(Math.random()-0.5)*280;
    const dy=-(120+Math.random()*220);
    const rot=Math.random()*900-450;
    const dur=0.6+Math.random()*0.5;
    p.style.cssText=`width:${size}px;height:${size*0.6}px;background:${colors[Math.floor(Math.random()*colors.length)]};left:50%;top:55%;--dx:${dx}px;--dy:${dy}px;--rot:${rot}deg;animation-duration:${dur}s;animation-delay:${Math.random()*0.1}s;border-radius:${Math.random()>0.4?'1px':'50%'};`;
    stage.appendChild(p);
    // Second wave: gravity fall after upward burst
    setTimeout(()=>{
      const p2=document.createElement('div');p2.className='particle confetti-gravity';
      const dx2=(Math.random()-0.5)*200;
      const dy2=150+Math.random()*200;
      p2.style.cssText=`width:${size}px;height:${size*0.6}px;background:${colors[Math.floor(Math.random()*colors.length)]};left:${30+Math.random()*40}%;top:${10+Math.random()*20}%;--dx:${dx2}px;--dy:${dy2}px;--rot:${Math.random()*360}deg;animation-duration:${0.8+Math.random()*0.6}s;border-radius:${Math.random()>0.4?'1px':'50%'};`;
      stage.appendChild(p2);
    },(dur*0.6)*1000+Math.random()*200);
  }
}

function flashScreen(stage,color){
  const f=document.createElement('div');f.className='flash';f.style.background=color;
  stage.appendChild(f);requestAnimationFrame(()=>f.classList.add('go'));
  haptic(30);
}
function shockwave(stage,color){
  const s=document.createElement('div');s.className='shockwave';
  s.style.cssText=`width:60px;height:60px;left:calc(50% - 30px);top:calc(50% - 30px);border-color:${color};`;
  stage.appendChild(s);requestAnimationFrame(()=>s.classList.add('go'));
}
function redPulse(stage){
  const r=document.createElement('div');r.className='red-pulse';
  stage.appendChild(r);requestAnimationFrame(()=>r.classList.add('go'));
}

// ── Wrong stamp ──
function slamWrongStamp(stage){
  const stamp=document.createElement('div');
  stamp.className='wrong-stamp';
  stamp.textContent='✕';
  stamp.style.cssText+='left:50%;top:50%;transform-origin:center;margin-left:-30px;margin-top:-40px;';
  stage.appendChild(stamp);
  haptic(40);
  requestAnimationFrame(()=>{stamp.classList.add('slam');});
  return stamp;
}

// ── Money counter ──
function countMoney(el,target,color,duration){
  const val=parseFloat(target);
  const steps=Math.ceil(duration/30);
  let step=0;
  const prefix=color==='var(--lose)'?'-$':'+$';
  const tick=setInterval(()=>{
    step++;
    const progress=step/steps;
    const eased=1-Math.pow(1-progress,3);
    const current=(val*eased).toFixed(2);
    el.textContent=prefix+current;
    if(step>=steps){clearInterval(tick);el.textContent=prefix+val.toFixed(2);}
  },30);
}

function showFinalDetails(stage,d,delay){
  setTimeout(()=>{
    const color=d.result==='win'?'var(--win)':d.result==='lose'?'var(--lose)':'var(--draw)';
    const isWin=d.result==='win';
    const isDraw=d.result==='draw';
    const payVal=isWin?d.payout:isDraw?d.payout:d.wager;
    const payLabel=isWin?'won':isDraw?'returned':'lost';

    const wrap=document.createElement('div');
    wrap.style.cssText='width:100%;opacity:0;transform:translateY(16px);transition:all 0.4s cubic-bezier(0,0,0.2,1);position:relative;z-index:10;';

    const payoutDisplay=isDraw?`$${d.payout} returned`:'$0.00';

    wrap.innerHTML=`
      <div class="result-payout" id="pay-${d.result}-${Math.random().toString(36).substr(2,4)}" style="color:${color}">${payoutDisplay}</div>
      <div class="result-payout-label">${payLabel}</div>
      <div class="answer-card" style="margin:6px 14px;width:calc(100% - 28px);">
        <div class="answer-row">
          <span class="answer-label">YOU</span>
          <span><span class="answer-val" style="color:${d.myCorrect?'var(--win)':'var(--lose)'}">${d.myAnswer}</span>${d.myTime!=null?`<span class="answer-time">${d.myTime}s</span>`:''}</span>
        </div>
        <div class="answer-divider"></div>
        <div class="answer-row">
          <span class="answer-label">${d.opponent}</span>
          <span><span class="answer-val" style="color:${d.oppCorrect?'var(--win)':'var(--lose)'}">${d.oppAnswer}</span>${d.oppTime!=null?`<span class="answer-time">${d.oppTime}s</span>`:''}</span>
        </div>
        <div class="answer-divider"></div>
        <div class="correct-row">
          <span class="answer-label">CORRECT</span>
          <span class="answer-val" style="color:var(--win)">${d.correctAnswer}</span>
        </div>
      </div>
      <div class="result-stats">
        <div class="result-stat"><span class="stat-num" style="color:var(--win)">${d.stats.wins}</span><span class="stat-label">WINS</span></div>
        <div class="result-stat"><span class="stat-num" style="color:var(--draw)">${d.stats.draws}</span><span class="stat-label">DRAWS</span></div>
        <div class="result-stat"><span class="stat-num" style="color:var(--lose)">${d.stats.losses}</span><span class="stat-label">LOSSES</span></div>
      </div>
      <div class="action-btns">
        <button class="btn-rib" style="opacity:0;transform:translateY(8px);transition:all 0.3s 0.2s;">RUN IT BACK</button>
        <button class="btn-home" style="opacity:0;transform:translateY(8px);transition:all 0.3s 0.35s;">HOME</button>
      </div>
    `;
    stage.appendChild(wrap);
    requestAnimationFrame(()=>{
      wrap.style.opacity='1';wrap.style.transform='translateY(0)';
      // Count up money
      if(!isDraw){
        const payEl=wrap.querySelector('.result-payout');
        setTimeout(()=>countMoney(payEl,payVal,color,600),100);
      }
      // Fade in buttons
      const btns=wrap.querySelectorAll('.action-btns button');
      setTimeout(()=>{btns.forEach(b=>{b.style.opacity='1';b.style.transform='translateY(0)';});},400);
    });
  },delay);
}

function countdownRace(stage,d,id){
  const isWin=d.result==='win';
  const isDraw=d.result==='draw';
  const bothCorrect=d.myCorrect&&d.oppCorrect;
  const resultColor=isWin?'var(--win)':isDraw?'var(--draw)':'var(--lose)';
  const rawColor=isWin?'#22C55E':isDraw?'#F59E0B':'#EF4444';

  // PHASE 1: ANSWERS
  const p1=document.createElement('div');
  p1.style.cssText='position:relative;z-index:5;text-align:center;width:100%;padding:0 16px;';

  const youBlock=document.createElement('div');
  youBlock.style.cssText='opacity:0;transform:translateY(14px);transition:all 0.4s cubic-bezier(0,0,0.2,1);margin-bottom:12px;';
  youBlock.innerHTML=`
    <div style="font-size:9px;color:var(--text2);font-weight:700;letter-spacing:2px;margin-bottom:4px">YOUR ANSWER</div>
    <div style="font-size:22px;font-weight:900;color:${d.myCorrect?'var(--win)':'var(--lose)'}">${d.myAnswer}</div>
    <div style="font-size:11px;font-weight:700;color:${d.myCorrect?'var(--win)':'var(--lose)'};margin-top:1px;letter-spacing:1px">${d.myCorrect?'✓ CORRECT':'✕ WRONG'}</div>
  `;
  p1.appendChild(youBlock);

  const divLine=document.createElement('div');
  divLine.style.cssText='width:36px;height:2px;background:var(--border);margin:0 auto 12px;opacity:0;transition:opacity 0.3s 0.3s;';
  p1.appendChild(divLine);

  const oppBlock=document.createElement('div');
  oppBlock.style.cssText='opacity:0;transform:translateY(14px);transition:all 0.5s cubic-bezier(0,0,0.2,1);';
  oppBlock.innerHTML=`
    <div style="font-size:9px;color:var(--text2);font-weight:700;letter-spacing:2px;margin-bottom:4px">${d.opponent}</div>
    <div id="opp-reveal-${id}" style="font-size:22px;font-weight:900;filter:blur(12px);color:var(--text2);transition:filter 0.6s ease-out,color 0.3s">???</div>
    <div id="opp-status-${id}" style="font-size:11px;font-weight:700;margin-top:1px;letter-spacing:1px;color:var(--text2);opacity:0;transition:opacity 0.3s">...</div>
  `;
  p1.appendChild(oppBlock);
  stage.appendChild(p1);

  // Animate your answer in
  setTimeout(()=>{youBlock.style.opacity='1';youBlock.style.transform='translateY(0)';haptic(10);},200);
  // If you got it wrong, slam stamp on your answer
  if(!d.myCorrect){
    setTimeout(()=>{
      const stamp=document.createElement('div');stamp.className='wrong-stamp';
      stamp.textContent='✕';
      stamp.style.cssText+='left:50%;top:22%;margin-left:-30px;';
      p1.appendChild(stamp);
      haptic(40);
      requestAnimationFrame(()=>stamp.classList.add('slam'));
    },600);
  }
  setTimeout(()=>{divLine.style.opacity='1';},500);
  setTimeout(()=>{oppBlock.style.opacity='1';oppBlock.style.transform='translateY(0)';},800);

  // Deblur opponent with haptic
  setTimeout(()=>{
    const oppEl=document.getElementById(`opp-reveal-${id}`);
    const oppSt=document.getElementById(`opp-status-${id}`);
    oppEl.textContent=d.oppAnswer;
    oppEl.style.filter='blur(0)';
    oppEl.style.color=d.oppCorrect?'var(--win)':'var(--lose)';
    oppSt.textContent=d.oppCorrect?'✓ CORRECT':'✕ WRONG';
    oppSt.style.color=d.oppCorrect?'var(--win)':'var(--lose)';
    oppSt.style.opacity='1';
    haptic(20);
    // If opponent wrong, slam stamp
    if(!d.oppCorrect){
      setTimeout(()=>{
        const stamp=document.createElement('div');stamp.className='wrong-stamp';
        stamp.textContent='✕';
        stamp.style.cssText+='left:50%;top:62%;margin-left:-30px;';
        p1.appendChild(stamp);
        haptic(40);
        requestAnimationFrame(()=>stamp.classList.add('slam'));
      },200);
    }
  },1500);

  // PHASE 2: TIME RACE or RESOLVE
  if(bothCorrect && d.myTime!=null && d.oppTime!=null){
    setTimeout(()=>{
      p1.style.transition='all 0.4s cubic-bezier(0,0,0.2,1)';
      p1.style.transform='translateY(-44px) scale(0.6)';
      p1.style.opacity='0.2';

      const race=document.createElement('div');
      race.style.cssText='position:relative;z-index:5;text-align:center;width:100%;padding:0 14px;opacity:0;transform:translateY(8px);transition:all 0.3s;';

      const sameTime=d.myTime===d.oppTime;
      race.innerHTML=`
        <div style="font-size:9px;color:var(--text2);font-weight:700;letter-spacing:2px;margin-bottom:12px">
          ${sameTime?'COMPARING TIMES...':'WHO WAS FASTER?'}
        </div>
        <div style="display:flex;justify-content:center;gap:12px;align-items:center;margin-bottom:12px;">
          <div style="flex:1;text-align:center;">
            <div style="font-size:9px;color:var(--text2);font-weight:700;margin-bottom:3px">YOU</div>
            <div id="rt1-${id}" style="font-size:28px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;line-height:1;">0.00<span style="font-size:12px;font-weight:600;color:var(--text2)">s</span></div>
          </div>
          <div style="font-size:14px;font-weight:900;color:var(--border)">vs</div>
          <div style="flex:1;text-align:center;">
            <div style="font-size:9px;color:var(--text2);font-weight:700;margin-bottom:3px">${d.opponent}</div>
            <div id="rt2-${id}" style="font-size:28px;font-weight:900;color:var(--text);font-variant-numeric:tabular-nums;line-height:1;">0.00<span style="font-size:12px;font-weight:600;color:var(--text2)">s</span></div>
          </div>
        </div>
        <div style="display:flex;gap:4px;height:6px;">
          <div style="flex:1;background:var(--border);border-radius:3px;overflow:hidden;position:relative;">
            <div id="bar1-${id}" style="position:absolute;right:0;top:0;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width 0.03s linear;"></div>
          </div>
          <div style="flex:1;background:var(--border);border-radius:3px;overflow:hidden;position:relative;">
            <div id="bar2-${id}" style="position:absolute;left:0;top:0;height:100%;width:0;background:var(--lose);border-radius:3px;transition:width 0.03s linear;"></div>
          </div>
        </div>
        <div id="gap-${id}" style="margin-top:8px;font-size:10px;color:var(--text2);font-weight:600;opacity:0;transition:opacity 0.2s;"></div>
      `;
      stage.appendChild(race);
      requestAnimationFrame(()=>{race.style.opacity='1';race.style.transform='translateY(0)';});

      const t1El=document.getElementById(`rt1-${id}`);
      const t2El=document.getElementById(`rt2-${id}`);
      const bar1=document.getElementById(`bar1-${id}`);
      const bar2=document.getElementById(`bar2-${id}`);
      const gapEl=document.getElementById(`gap-${id}`);

      const maxTime=Math.max(d.myTime,d.oppTime);
      const duration=2000;
      const step=25;
      let elapsed=0;
      let gapShown=false;

      const ticker=setInterval(()=>{
        elapsed+=step;
        const progress=Math.min(elapsed/duration,1);
        const displayMax=maxTime*progress*1.1;
        const t1=Math.min(displayMax,d.myTime);
        const t2=Math.min(displayMax,d.oppTime);
        t1El.innerHTML=`${t1.toFixed(2)}<span style="font-size:12px;font-weight:600;color:var(--text2)">s</span>`;
        t2El.innerHTML=`${t2.toFixed(2)}<span style="font-size:12px;font-weight:600;color:var(--text2)">s</span>`;
        bar1.style.width=`${(t1/maxTime)*100}%`;
        bar2.style.width=`${(t2/maxTime)*100}%`;

        // Show gap when one stops
        if(!gapShown){
          if(t1>=d.myTime&&t2<d.oppTime){
            gapEl.textContent=`+${(d.oppTime-d.myTime).toFixed(2)}s gap`;
            gapEl.style.opacity='1';gapShown=true;haptic(15);
          }else if(t2>=d.oppTime&&t1<d.myTime){
            gapEl.textContent=`+${(d.myTime-d.oppTime).toFixed(2)}s gap`;
            gapEl.style.opacity='1';gapShown=true;haptic(15);
          }
        }

        // Vibration builds
        if(progress>0.7){
          const intensity=(progress-0.7)*10;
          stage.style.transform=`translateX(${(Math.random()-0.5)*intensity*3}px)`;
          if(progress>0.9)haptic(5);
        }

        if(elapsed>=duration){
          clearInterval(ticker);
          stage.style.transform='';
          t1El.innerHTML=`${d.myTime.toFixed(2)}<span style="font-size:12px;font-weight:600;color:var(--text2)">s</span>`;
          t2El.innerHTML=`${d.oppTime.toFixed(2)}<span style="font-size:12px;font-weight:600;color:var(--text2)">s</span>`;

          if(d.myTime<d.oppTime){
            t1El.style.color='var(--win)';t2El.style.color='var(--text2)';
            bar1.style.background='var(--win)';
          }else if(d.oppTime<d.myTime){
            t2El.style.color='var(--win)';t1El.style.color='var(--text2)';
            bar2.style.background='var(--win)';
          }else{
            t1El.style.color='var(--draw)';t2El.style.color='var(--draw)';
            bar1.style.background='var(--draw)';bar2.style.background='var(--draw)';
            gapEl.textContent='EXACT SAME TIME';
            gapEl.style.opacity='1';gapEl.style.color='var(--draw)';
          }
          haptic(50);

          setTimeout(()=>{
            race.remove();p1.remove();
            doExplosion(stage,d,rawColor,resultColor);
          },700);
        }
      },step);
    },2400);
  }else{
    // One wrong or timeout — pause on stamp, then resolve
    setTimeout(()=>{p1.remove();doExplosion(stage,d,rawColor,resultColor);},2800);
  }
}

function doExplosion(stage,d,rawColor,resultColor){
  const isWin=d.result==='win';
  const isDraw=d.result==='draw';

  if(isWin){
    flashScreen(stage,'rgba(255,255,255,0.9)');
    setTimeout(()=>flashScreen(stage,'rgba(34,197,94,0.3)'),80);
    shockwave(stage,'#22C55E');
    setTimeout(()=>shockwave(stage,'#6C63FF'),120);
    setTimeout(()=>shockwave(stage,'#F59E0B'),220);
    stage.classList.add('shaking');
    spawnConfettiCannon(stage,60,'win');
    haptic([30,20,50]);
  }else if(isDraw){
    flashScreen(stage,'rgba(245,158,11,0.25)');
    shockwave(stage,'#F59E0B');
    spawnConfettiCannon(stage,25,'draw');
    haptic(25);
  }else{
    // Loss: red pulse, not a party
    flashScreen(stage,'rgba(239,68,68,0.4)');
    redPulse(stage);
    shockwave(stage,'#EF4444');
    stage.classList.add('shaking');
    spawnConfettiCannon(stage,12,'lose');
    haptic([50,30,50]);
  }

  // Banner slams down from above
  setTimeout(()=>{
    const banner=document.createElement('div');
    banner.className='result-banner';
    banner.style.cssText=`color:${resultColor};transform:translateY(-60px) scale(1.3);opacity:0;transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);`;
    banner.textContent=d.banner;
    stage.appendChild(banner);
    requestAnimationFrame(()=>{
      banner.style.transform='translateY(0) scale(1)';
      banner.style.opacity='1';
    });
    haptic(30);
    showFinalDetails(stage,d,400);
  },180);
}
</script>
</body>
</html>
