<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Question Countdown Concepts — Sense</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; color: #fff; min-height: 100vh; }

.selector { display: flex; gap: 8px; padding: 16px; flex-wrap: wrap; justify-content: center; background: #1a1a1a; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 1000; }
.selector button { padding: 10px 16px; border: 2px solid #444; border-radius: 12px; background: transparent; color: #ccc; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.selector button:hover { border-color: #888; color: #fff; }
.selector button.active { border-color: #7c5cfc; background: rgba(124,92,252,0.15); color: #fff; }

.concept-info { text-align: center; padding: 20px 16px 8px; }
.concept-info h2 { font-size: 20px; margin-bottom: 6px; }
.concept-info p { font-size: 14px; color: #888; max-width: 520px; margin: 0 auto; line-height: 1.5; }

.phone-frame { width: 380px; height: 720px; margin: 16px auto; border-radius: 40px; border: 4px solid #333; position: relative; overflow: hidden; background: #fafafa; }
.phone-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 160px; height: 30px; background: #111; border-radius: 0 0 20px 20px; z-index: 500; }

.countdown-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }

.replay-btn { display: block; margin: 16px auto 40px; padding: 14px 40px; background: #7c5cfc; border: none; border-radius: 14px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; letter-spacing: 0.5px; }
.replay-btn:hover { background: #6a4aed; transform: scale(1.02); }

/* Fake game UI behind countdown */
.fake-game { position: absolute; inset: 0; padding: 80px 20px 20px; opacity: 0.15; }
.fake-header { text-align: center; font-size: 13px; font-weight: 600; color: #666; letter-spacing: 1px; margin-bottom: 30px; }
.fake-image { width: 200px; height: 200px; background: #e0e0e0; border-radius: 16px; margin: 0 auto 20px; }
.fake-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fake-option { height: 48px; background: #e8e8e8; border-radius: 12px; }
</style>
</head>
<body>

<div class="selector">
  <button class="active" onclick="pick(0)">1. Heartbeat</button>
  <button onclick="pick(1)">2. Shatter</button>
  <button onclick="pick(2)">3. War Drums</button>
  <button onclick="pick(3)">4. Lockdown</button>
  <button onclick="pick(4)">5. Void Rip</button>
</div>

<div class="concept-info" id="info"></div>
<div class="phone-frame" id="phone">
  <div class="phone-notch"></div>
  <div class="fake-game">
    <div class="fake-header">WHAT ANIMAL IS THIS?</div>
    <div class="fake-image"></div>
    <div class="fake-options"><div class="fake-option"></div><div class="fake-option"></div><div class="fake-option"></div><div class="fake-option"></div></div>
  </div>
  <div class="countdown-stage" id="stage"></div>
</div>
<button class="replay-btn" onclick="play()">▶ Replay</button>

<script>
let current = 0;
let timers = [];
let intervals = [];
let animFrames = [];

const concepts = [
  {
    name: "Heartbeat",
    desc: "Each number throbs like a cardiac beat — fast punch outward, slow elastic contraction. Screen edges pulse with a red vignette on impact. BPM accelerates: 3 is calm, 2 is nervous, 1 is racing. The background dims between beats like the space between heartbeats. On GO the heart STOPS — white flash defibrillator shock."
  },
  {
    name: "Glass Shatter",
    desc: "The screen is a pane of glass. 3 cracks it — hairline fractures radiate from the number. 2 shatters deeper — chunks separate, you see through to the game underneath. 1 is barely holding — the whole screen vibrates. GO smashes it completely — glass shards fly outward revealing the question. Each impact has a heavy thud shake."
  },
  {
    name: "War Drums",
    desc: "Concentric rings pulse outward from each number like drum hits on water. 3 is one ring — subtle. 2 is two rings — stronger. 1 is three rings erupting — the screen shakes. Each hit the background darkens like a war march. GO unleashes a final massive ring that fills the entire screen and dissolves into the question."
  },
  {
    name: "Lockdown Protocol",
    desc: "Military/hacker aesthetic. Screen flickers with scan lines. 3 — 'INITIALIZING TARGET' with a scanning crosshair. 2 — 'LOCKING ON' crosshair tightens. 1 — 'TARGET ACQUIRED' crosshair snaps to center, screen goes red alert. GO — 'ENGAGE' with full screen wipe. Each step has data noise and glitch effects."
  },
  {
    name: "Void Rip",
    desc: "Screen starts normal, then a crack in reality opens in the center. 3 — small tear with purple energy leaking through. 2 — the tear widens, pulling the edges of the screen inward like gravity. 1 — the void is massive, everything is being sucked in, particles stream toward center. GO — reality snaps back with a shockwave that pushes everything outward."
  }
];

function haptic(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

function pick(i) {
  current = i;
  document.querySelectorAll('.selector button').forEach((b,j) => b.classList.toggle('active', j===i));
  play();
}

function clearAll() {
  timers.forEach(clearTimeout); intervals.forEach(clearInterval);
  animFrames.forEach(cancelAnimationFrame);
  timers = []; intervals = []; animFrames = [];
}

function t(fn, ms) { const id = setTimeout(fn, ms); timers.push(id); return id; }

function play() {
  clearAll();
  const info = document.getElementById('info');
  info.innerHTML = `<h2>${concepts[current].name}</h2><p>${concepts[current].desc}</p>`;
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  stage.style.cssText = '';
  [concept1, concept2, concept3, concept4, concept5][current](stage);
}

// ======== 1. HEARTBEAT ========
function concept1(stage) {
  stage.style.background = '#fff';

  // Vignette element
  const vig = document.createElement('div');
  vig.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity 0.12s;background:radial-gradient(ellipse at center, transparent 30%, rgba(180,40,40,0.25) 100%);';
  stage.appendChild(vig);

  // Number container
  const numEl = document.createElement('div');
  numEl.style.cssText = 'font-size:140px;font-weight:900;color:#7c5cfc;position:relative;z-index:10;opacity:0;';
  stage.appendChild(numEl);

  const labelEl = document.createElement('div');
  labelEl.style.cssText = 'font-size:16px;font-weight:700;color:#999;letter-spacing:3px;text-transform:uppercase;margin-top:8px;z-index:10;opacity:0;transition:opacity 0.3s;';
  labelEl.textContent = 'GET READY';
  stage.appendChild(labelEl);

  // Sub-pulse ring
  const ring = document.createElement('div');
  ring.style.cssText = 'position:absolute;width:180px;height:180px;border-radius:50%;border:3px solid rgba(124,92,252,0.2);z-index:4;opacity:0;';
  stage.appendChild(ring);

  function beat(num, delay, intensity, bpm) {
    t(() => {
      numEl.textContent = num;
      numEl.style.opacity = '1';
      labelEl.style.opacity = '1';

      // Thump animation — fast punch out, slow elastic return
      numEl.style.transition = 'none';
      numEl.style.transform = `scale(2.2)`;
      numEl.style.opacity = '0.3';

      // Ring burst
      ring.style.transition = 'none';
      ring.style.transform = 'scale(0.5)';
      ring.style.opacity = '0.6';

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          numEl.style.transition = `transform 0.5s cubic-bezier(0.34,1.56,0.64,1), opacity 0.15s ease`;
          numEl.style.transform = 'scale(1)';
          numEl.style.opacity = '1';

          ring.style.transition = 'all 0.6s ease-out';
          ring.style.transform = `scale(${2 + intensity})`;
          ring.style.opacity = '0';
        });
      });

      // Vignette pulse
      vig.style.opacity = String(0.3 + intensity * 0.3);
      t(() => { vig.style.opacity = '0'; }, 150);

      // Shake
      const shk = intensity * 6;
      stage.style.transform = `translate(${(Math.random()-0.5)*shk}px, ${(Math.random()-0.5)*shk*0.6}px)`;
      t(() => { stage.style.transform = ''; }, 100);

      // Dim between beats
      t(() => {
        if (num !== '1') {
          numEl.style.transition = 'opacity 0.3s ease';
          numEl.style.opacity = '0.15';
          stage.style.background = `rgb(${250 - intensity*30}, ${250 - intensity*30}, ${252 - intensity*20})`;
        }
      }, 400);

      haptic(Math.floor(10 + intensity * 30));
    }, delay);
  }

  // 3 — calm (75bpm feel)
  beat('3', 100, 0.3, 75);
  // 2 — nervous (110bpm feel)
  beat('2', 900, 0.6, 110);
  // 1 — racing (150bpm feel)
  beat('1', 1600, 1.0, 150);

  // GO — defibrillator shock
  t(() => {
    // White flash
    numEl.textContent = 'GO';
    numEl.style.fontSize = '80px';
    numEl.style.color = '#22c55e';
    numEl.style.transition = 'none';
    numEl.style.transform = 'scale(2.5)';
    numEl.style.opacity = '0';
    labelEl.style.opacity = '0';

    stage.style.background = '#fff';

    // Flash overlay
    const flash = document.createElement('div');
    flash.style.cssText = 'position:absolute;inset:0;background:rgba(255,255,255,1);z-index:20;opacity:1;transition:opacity 0.4s ease;';
    stage.appendChild(flash);

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        numEl.style.transition = 'all 0.3s cubic-bezier(0.34,1.56,0.64,1)';
        numEl.style.transform = 'scale(1)';
        numEl.style.opacity = '1';
        flash.style.opacity = '0';
      });
    });

    haptic(50);

    // Clear
    t(() => {
      stage.style.transition = 'opacity 0.3s';
      stage.style.opacity = '0';
    }, 600);
  }, 2300);
}

// ======== 2. GLASS SHATTER ========
function concept2(stage) {
  stage.style.background = '#fff';

  const numEl = document.createElement('div');
  numEl.style.cssText = 'font-size:150px;font-weight:900;color:#7c5cfc;z-index:10;position:relative;opacity:0;';
  stage.appendChild(numEl);

  const labelEl = document.createElement('div');
  labelEl.style.cssText = 'font-size:16px;font-weight:700;color:#999;letter-spacing:3px;text-transform:uppercase;margin-top:8px;z-index:10;opacity:0;';
  labelEl.textContent = 'GET READY';
  stage.appendChild(labelEl);

  // Crack SVG overlay
  const crackSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  crackSvg.setAttribute('viewBox', '0 0 380 720');
  crackSvg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none;';
  stage.appendChild(crackSvg);

  // Glass frost overlay
  const frost = document.createElement('div');
  frost.style.cssText = 'position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;transition:opacity 0.2s;background:linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(200,200,220,0.1) 50%, rgba(255,255,255,0) 100%);';
  stage.appendChild(frost);

  function addCracks(cx, cy, count, length, intensity) {
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.8;
      const len = length * (0.6 + Math.random() * 0.8);
      let x = cx, y = cy;
      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      let d = `M ${x} ${y}`;
      const segments = 3 + Math.floor(Math.random() * 4);
      for (let s = 0; s < segments; s++) {
        const segLen = len / segments;
        const jitter = (Math.random() - 0.5) * 30;
        x += Math.cos(angle + jitter * 0.05) * segLen;
        y += Math.sin(angle + jitter * 0.05) * segLen;
        d += ` L ${x} ${y}`;
        // Branch
        if (Math.random() < 0.3 * intensity) {
          const bAngle = angle + (Math.random() - 0.5) * 1.5;
          const bLen = segLen * 0.5;
          const bx = x + Math.cos(bAngle) * bLen;
          const by = y + Math.sin(bAngle) * bLen;
          const branch = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          branch.setAttribute('d', `M ${x} ${y} L ${bx} ${by}`);
          branch.setAttribute('stroke', 'rgba(100,100,120,0.4)');
          branch.setAttribute('stroke-width', '1');
          branch.setAttribute('fill', 'none');
          crackSvg.appendChild(branch);
        }
      }
      path.setAttribute('d', d);
      path.setAttribute('stroke', `rgba(80,80,100,${0.3 + intensity * 0.3})`);
      path.setAttribute('stroke-width', String(1 + intensity));
      path.setAttribute('fill', 'none');
      // Animate drawing
      const totalLen = path.getTotalLength ? 500 : 500;
      path.style.strokeDasharray = totalLen;
      path.style.strokeDashoffset = totalLen;
      path.style.transition = `stroke-dashoffset ${0.3 + Math.random()*0.2}s ease-out`;
      crackSvg.appendChild(path);
      requestAnimationFrame(() => { path.style.strokeDashoffset = '0'; });
    }
  }

  function impact(num, delay, intensity) {
    t(() => {
      numEl.textContent = num;
      numEl.style.opacity = '1';
      labelEl.style.opacity = '1';
      numEl.style.transition = 'none';
      numEl.style.transform = 'scale(2) rotate(-5deg)';

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          numEl.style.transition = 'all 0.35s cubic-bezier(0.34,1.56,0.64,1)';
          numEl.style.transform = 'scale(1) rotate(0deg)';
        });
      });

      // Add cracks from impact point
      const cx = 190 + (Math.random()-0.5)*60;
      const cy = 320 + (Math.random()-0.5)*80;
      addCracks(cx, cy, 4 + Math.floor(intensity * 6), 80 + intensity * 120, intensity);

      // Frost builds
      frost.style.opacity = String(intensity * 0.4);

      // Shake — heavier each time
      const shk = 4 + intensity * 14;
      stage.style.transform = `translate(${(Math.random()-0.5)*shk}px, ${(Math.random()-0.5)*shk}px)`;
      t(() => { stage.style.transform = ''; }, 120);

      haptic(Math.floor(15 + intensity * 40));

      // Vibrate on 1
      if (num === '1') {
        let vibCount = 0;
        const vibrate = setInterval(() => {
          vibCount++;
          const v = 2 + Math.random() * 3;
          stage.style.transform = `translate(${(Math.random()-0.5)*v}px, ${(Math.random()-0.5)*v}px)`;
          if (vibCount > 15) { clearInterval(vibrate); stage.style.transform = ''; }
        }, 30);
        intervals.push(vibrate);
      }
    }, delay);
  }

  impact('3', 100, 0.2);
  impact('2', 900, 0.5);
  impact('1', 1600, 1.0);

  // GO — full shatter
  t(() => {
    numEl.textContent = 'GO';
    numEl.style.fontSize = '80px';
    numEl.style.color = '#22c55e';
    numEl.style.transition = 'none';
    numEl.style.transform = 'scale(3)';

    // Spawn glass shards
    for (let i = 0; i < 30; i++) {
      const shard = document.createElement('div');
      const size = 10 + Math.random() * 40;
      const startX = Math.random() * 380;
      const startY = Math.random() * 720;
      shard.style.cssText = `
        position:absolute;left:${startX}px;top:${startY}px;
        width:${size}px;height:${size * (0.4+Math.random()*0.8)}px;
        background:linear-gradient(${Math.random()*360}deg, rgba(200,200,220,0.6), rgba(255,255,255,0.3));
        clip-path:polygon(${Math.random()*30}% 0%, 100% ${Math.random()*40}%, ${60+Math.random()*40}% 100%, 0% ${60+Math.random()*40}%);
        z-index:15;opacity:1;transition:all 0.6s cubic-bezier(0.25,0.46,0.45,0.94);
        backdrop-filter:blur(1px);
      `;
      stage.appendChild(shard);
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const angle = Math.atan2(startY - 360, startX - 190);
          shard.style.transform = `translate(${Math.cos(angle)*200}px, ${Math.sin(angle)*200}px) rotate(${Math.random()*180}deg)`;
          shard.style.opacity = '0';
        });
      });
    }

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        numEl.style.transition = 'all 0.3s cubic-bezier(0.34,1.56,0.64,1)';
        numEl.style.transform = 'scale(1)';
      });
    });

    // Clear cracks
    crackSvg.innerHTML = '';
    frost.style.opacity = '0';

    haptic(60);

    t(() => {
      stage.style.transition = 'opacity 0.3s';
      stage.style.opacity = '0';
    }, 600);
  }, 2300);
}

// ======== 3. WAR DRUMS ========
function concept3(stage) {
  stage.style.background = '#fff';

  const numEl = document.createElement('div');
  numEl.style.cssText = 'font-size:150px;font-weight:900;color:#7c5cfc;z-index:10;position:relative;opacity:0;';
  stage.appendChild(numEl);

  const labelEl = document.createElement('div');
  labelEl.style.cssText = 'font-size:16px;font-weight:700;color:#999;letter-spacing:3px;text-transform:uppercase;margin-top:8px;z-index:10;opacity:0;';
  labelEl.textContent = 'GET READY';
  stage.appendChild(labelEl);

  function drumHit(num, delay, ringCount, intensity) {
    t(() => {
      numEl.textContent = num;
      numEl.style.opacity = '1';
      labelEl.style.opacity = '1';
      numEl.style.transition = 'none';
      numEl.style.transform = 'scale(0.5)';
      numEl.style.opacity = '0';

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          numEl.style.transition = `all 0.25s cubic-bezier(0.34,1.56,0.64,1)`;
          numEl.style.transform = 'scale(1)';
          numEl.style.opacity = '1';
        });
      });

      // Concentric rings
      for (let r = 0; r < ringCount; r++) {
        t(() => {
          const ring = document.createElement('div');
          ring.style.cssText = `
            position:absolute;top:50%;left:50%;width:${40+r*10}px;height:${40+r*10}px;
            border-radius:50%;border:${2+intensity}px solid rgba(124,92,252,${0.5-r*0.1});
            transform:translate(-50%,-50%) scale(0.3);opacity:0.8;z-index:5;
            transition:all ${0.6+r*0.1}s cubic-bezier(0,0,0.2,1);pointer-events:none;
          `;
          stage.appendChild(ring);
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              ring.style.transform = `translate(-50%,-50%) scale(${4+intensity*3})`;
              ring.style.opacity = '0';
            });
          });
          setTimeout(() => ring.remove(), 1000);
        }, r * 80);
      }

      // Screen darkens progressively
      const darkness = intensity * 0.12;
      stage.style.background = `rgb(${Math.floor(255-darkness*255)}, ${Math.floor(255-darkness*255)}, ${Math.floor(255-darkness*200)})`;

      // Heavy thud shake
      const shk = 3 + intensity * 12;
      stage.style.transform = `translate(0, ${shk}px)`;
      t(() => {
        stage.style.transition = 'transform 0.2s cubic-bezier(0.34,1.56,0.64,1)';
        stage.style.transform = '';
        t(() => { stage.style.transition = ''; }, 200);
      }, 50);

      haptic(Math.floor(10 + intensity * 40));

      // Sub-hits on higher intensity
      if (intensity > 0.5) {
        t(() => {
          const shk2 = intensity * 4;
          stage.style.transform = `translate(${(Math.random()-0.5)*shk2}px, ${shk2*0.5}px)`;
          t(() => { stage.style.transform = ''; }, 80);
        }, 250);
      }
    }, delay);
  }

  drumHit('3', 100, 1, 0.2);
  drumHit('2', 900, 2, 0.5);
  drumHit('1', 1600, 3, 1.0);

  // GO — massive ring explosion
  t(() => {
    numEl.textContent = 'GO';
    numEl.style.fontSize = '80px';
    numEl.style.color = '#22c55e';
    numEl.style.transition = 'none';
    numEl.style.transform = 'scale(0.3)';
    numEl.style.opacity = '0';

    // 6 rapid rings
    for (let r = 0; r < 6; r++) {
      t(() => {
        const ring = document.createElement('div');
        const colors = ['rgba(124,92,252,0.5)','rgba(34,197,94,0.4)','rgba(245,158,11,0.3)','rgba(236,72,153,0.3)','rgba(6,182,212,0.3)','rgba(124,92,252,0.2)'];
        ring.style.cssText = `
          position:absolute;top:50%;left:50%;width:30px;height:30px;
          border-radius:50%;border:3px solid ${colors[r]};
          transform:translate(-50%,-50%) scale(0.1);opacity:0.9;z-index:5;
          transition:all 0.7s cubic-bezier(0,0,0.2,1);pointer-events:none;
        `;
        stage.appendChild(ring);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            ring.style.transform = `translate(-50%,-50%) scale(${12+r*2})`;
            ring.style.opacity = '0';
          });
        });
      }, r * 40);
    }

    stage.style.background = '#fff';

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        numEl.style.transition = 'all 0.3s cubic-bezier(0.34,1.56,0.64,1)';
        numEl.style.transform = 'scale(1)';
        numEl.style.opacity = '1';
      });
    });

    haptic(60);
    t(() => { stage.style.transition = 'opacity 0.3s'; stage.style.opacity = '0'; }, 600);
  }, 2300);
}

// ======== 4. LOCKDOWN PROTOCOL ========
function concept4(stage) {
  stage.style.background = '#0a0a0a';

  // Scanlines
  const scanlines = document.createElement('div');
  scanlines.style.cssText = `position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0.15;
    background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,0,0.03) 2px, rgba(0,255,0,0.03) 4px);`;
  stage.appendChild(scanlines);

  // Crosshair
  const crosshair = document.createElement('div');
  crosshair.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;';
  crosshair.innerHTML = `
    <div style="width:120px;height:120px;position:relative;transition:all 0.4s cubic-bezier(0.34,1.56,0.64,1);">
      <div style="position:absolute;top:0;left:50%;width:2px;height:20px;background:#22c55e;transform:translateX(-50%);"></div>
      <div style="position:absolute;bottom:0;left:50%;width:2px;height:20px;background:#22c55e;transform:translateX(-50%);"></div>
      <div style="position:absolute;left:0;top:50%;width:20px;height:2px;background:#22c55e;transform:translateY(-50%);"></div>
      <div style="position:absolute;right:0;top:50%;width:20px;height:2px;background:#22c55e;transform:translateY(-50%);"></div>
      <div style="position:absolute;top:0;left:0;width:16px;height:16px;border-top:2px solid #22c55e;border-left:2px solid #22c55e;"></div>
      <div style="position:absolute;top:0;right:0;width:16px;height:16px;border-top:2px solid #22c55e;border-right:2px solid #22c55e;"></div>
      <div style="position:absolute;bottom:0;left:0;width:16px;height:16px;border-bottom:2px solid #22c55e;border-left:2px solid #22c55e;"></div>
      <div style="position:absolute;bottom:0;right:0;width:16px;height:16px;border-bottom:2px solid #22c55e;border-right:2px solid #22c55e;"></div>
    </div>
  `;
  stage.appendChild(crosshair);

  // Status text
  const status = document.createElement('div');
  status.style.cssText = 'position:absolute;top:25%;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:#22c55e;letter-spacing:4px;z-index:10;font-family:monospace;opacity:0;white-space:nowrap;';
  stage.appendChild(status);

  // Number
  const numEl = document.createElement('div');
  numEl.style.cssText = 'font-size:140px;font-weight:900;color:#22c55e;z-index:10;position:relative;opacity:0;font-family:monospace;text-shadow:0 0 40px rgba(34,197,94,0.5);';
  stage.appendChild(numEl);

  // Data noise
  const noise = document.createElement('div');
  noise.style.cssText = 'position:absolute;bottom:15%;left:50%;transform:translateX(-50%);font-size:10px;color:rgba(34,197,94,0.3);font-family:monospace;z-index:6;text-align:center;white-space:pre;line-height:1.4;';
  stage.appendChild(noise);

  function lockStep(num, delay, statusText, crosshairSize) {
    t(() => {
      // Glitch flash
      stage.style.background = '#1a1a1a';
      t(() => { stage.style.background = '#0a0a0a'; }, 50);
      t(() => { stage.style.background = '#0d1a0d'; }, 80);
      t(() => { stage.style.background = '#0a0a0a'; }, 130);

      numEl.textContent = num;
      numEl.style.opacity = '1';
      numEl.style.transition = 'none';
      numEl.style.transform = 'scale(1.5) skewX(-10deg)';

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          numEl.style.transition = 'all 0.3s cubic-bezier(0.34,1.56,0.64,1)';
          numEl.style.transform = 'scale(1) skewX(0deg)';
        });
      });

      status.textContent = statusText;
      status.style.opacity = '1';

      // Crosshair tightens
      const ch = crosshair.firstElementChild;
      ch.style.width = crosshairSize + 'px';
      ch.style.height = crosshairSize + 'px';

      // Random data noise
      let noiseText = '';
      for (let i = 0; i < 4; i++) {
        noiseText += Array.from({length:28}, () => '0123456789ABCDEF'[Math.floor(Math.random()*16)]).join('') + '\n';
      }
      noise.textContent = noiseText;

      // Shake
      const shk = num === '1' ? 10 : 4;
      stage.style.transform = `translate(${(Math.random()-0.5)*shk}px, ${(Math.random()-0.5)*shk}px)`;
      t(() => { stage.style.transform = ''; }, 100);

      haptic(num === '1' ? 40 : 15);

      // Red alert on 1
      if (num === '1') {
        numEl.style.color = '#ef4444';
        numEl.style.textShadow = '0 0 60px rgba(239,68,68,0.6)';
        stage.style.background = 'rgba(30,5,5,1)';
        status.style.color = '#ef4444';

        // Alarm blink
        let blinks = 0;
        const blinker = setInterval(() => {
          blinks++;
          scanlines.style.opacity = blinks % 2 ? '0.3' : '0.1';
          if (blinks > 8) clearInterval(blinker);
        }, 60);
        intervals.push(blinker);
      }
    }, delay);
  }

  lockStep('3', 100, '◉ INITIALIZING TARGET...', 120);
  lockStep('2', 900, '◎ LOCKING ON...', 70);
  lockStep('1', 1600, '⚠ TARGET ACQUIRED', 40);

  // GO — ENGAGE
  t(() => {
    numEl.textContent = 'GO';
    numEl.style.fontSize = '70px';
    numEl.style.color = '#22c55e';
    numEl.style.textShadow = '0 0 80px rgba(34,197,94,0.8)';
    numEl.style.transition = 'none';
    numEl.style.transform = 'scale(3)';
    numEl.style.opacity = '0';
    status.textContent = '▶ ENGAGE';
    status.style.color = '#22c55e';

    // Wipe effect — green bar sweeps down
    const wipe = document.createElement('div');
    wipe.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:0;background:rgba(34,197,94,0.3);z-index:20;transition:height 0.3s ease-in;';
    stage.appendChild(wipe);
    requestAnimationFrame(() => { wipe.style.height = '100%'; });

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        numEl.style.transition = 'all 0.25s cubic-bezier(0.34,1.56,0.64,1)';
        numEl.style.transform = 'scale(1)';
        numEl.style.opacity = '1';
      });
    });

    haptic(60);
    t(() => { stage.style.transition = 'opacity 0.3s'; stage.style.opacity = '0'; }, 600);
  }, 2300);
}

// ======== 5. VOID RIP ========
function concept5(stage) {
  stage.style.background = '#fff';

  const numEl = document.createElement('div');
  numEl.style.cssText = 'font-size:140px;font-weight:900;color:#7c5cfc;z-index:10;position:relative;opacity:0;';
  stage.appendChild(numEl);

  const labelEl = document.createElement('div');
  labelEl.style.cssText = 'font-size:16px;font-weight:700;color:#999;letter-spacing:3px;text-transform:uppercase;margin-top:8px;z-index:10;opacity:0;';
  labelEl.textContent = 'GET READY';
  stage.appendChild(labelEl);

  // Void tear — using a gradient that simulates a crack in reality
  const tear = document.createElement('div');
  tear.style.cssText = `
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:0;height:0;z-index:4;pointer-events:none;
    background:radial-gradient(ellipse, #1a0a2e 0%, rgba(124,92,252,0.4) 40%, transparent 70%);
    border-radius:50%;transition:all 0.5s cubic-bezier(0.34,1.56,0.64,1);
    box-shadow:0 0 0 0 rgba(124,92,252,0);
  `;
  stage.appendChild(tear);

  // Energy particles container
  const particleLayer = document.createElement('div');
  particleLayer.style.cssText = 'position:absolute;inset:0;z-index:5;pointer-events:none;overflow:hidden;';
  stage.appendChild(particleLayer);

  // Edge warp overlay
  const warp = document.createElement('div');
  warp.style.cssText = 'position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity 0.3s;';
  stage.appendChild(warp);

  function spawnParticles(count, inward, intensity) {
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      const angle = Math.random() * Math.PI * 2;
      const dist = 150 + Math.random() * 200;
      const startX = 190 + Math.cos(angle) * dist;
      const startY = 360 + Math.sin(angle) * dist;
      const size = 2 + Math.random() * 4;
      const colors = ['#7c5cfc','#a78bfa','#c4b5fd','#818cf8','#6366f1'];

      p.style.cssText = `
        position:absolute;left:${startX}px;top:${startY}px;
        width:${size}px;height:${size}px;border-radius:50%;
        background:${colors[Math.floor(Math.random()*colors.length)]};
        opacity:0.8;transition:all ${0.4+Math.random()*0.4}s cubic-bezier(0.4,0,0.2,1);
        box-shadow:0 0 ${size*2}px ${colors[Math.floor(Math.random()*colors.length)]};
      `;
      particleLayer.appendChild(p);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (inward) {
            p.style.left = (190 + (Math.random()-0.5)*20) + 'px';
            p.style.top = (360 + (Math.random()-0.5)*20) + 'px';
          } else {
            p.style.left = (startX + Math.cos(angle)*300) + 'px';
            p.style.top = (startY + Math.sin(angle)*300) + 'px';
          }
          p.style.opacity = '0';
        });
      });

      setTimeout(() => p.remove(), 800);
    }
  }

  function voidStep(num, delay, tearSize, intensity) {
    t(() => {
      numEl.textContent = num;
      numEl.style.opacity = '1';
      labelEl.style.opacity = '1';
      numEl.style.transition = 'none';
      numEl.style.transform = 'scale(2.5)';
      numEl.style.opacity = '0';

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          numEl.style.transition = 'all 0.4s cubic-bezier(0.34,1.56,0.64,1)';
          numEl.style.transform = 'scale(1)';
          numEl.style.opacity = '1';
        });
      });

      // Tear grows
      tear.style.width = tearSize + 'px';
      tear.style.height = tearSize + 'px';
      tear.style.boxShadow = `0 0 ${tearSize}px ${tearSize*0.3}px rgba(124,92,252,${0.1+intensity*0.2})`;

      // Particles get sucked in
      spawnParticles(Math.floor(5 + intensity * 15), true, intensity);

      // Background warps — edges darken
      const vignette = intensity * 0.3;
      warp.style.opacity = '1';
      warp.style.background = `radial-gradient(ellipse at center, transparent ${60 - intensity*40}%, rgba(26,10,46,${vignette}) 100%)`;

      // Stage pulls inward slightly
      const pull = 1 - intensity * 0.02;
      stage.style.transform = `scale(${pull})`;

      // Shake
      const shk = intensity * 8;
      t(() => {
        stage.style.transform = `scale(${pull}) translate(${(Math.random()-0.5)*shk}px, ${(Math.random()-0.5)*shk}px)`;
        t(() => { stage.style.transform = `scale(${pull})`; }, 100);
      }, 50);

      haptic(Math.floor(10 + intensity * 35));

      // On 1 — constant particle stream
      if (num === '1') {
        let streamCount = 0;
        const stream = setInterval(() => {
          streamCount++;
          spawnParticles(3, true, 1);
          const v = 2 + Math.random() * 3;
          stage.style.transform = `scale(0.98) translate(${(Math.random()-0.5)*v}px, ${(Math.random()-0.5)*v}px)`;
          if (streamCount > 12) clearInterval(stream);
        }, 50);
        intervals.push(stream);
      }
    }, delay);
  }

  voidStep('3', 100, 30, 0.2);
  voidStep('2', 900, 80, 0.5);
  voidStep('1', 1600, 160, 1.0);

  // GO — reality snaps back
  t(() => {
    numEl.textContent = 'GO';
    numEl.style.fontSize = '80px';
    numEl.style.color = '#22c55e';
    numEl.style.transition = 'none';
    numEl.style.transform = 'scale(0.1)';
    numEl.style.opacity = '0';
    labelEl.style.opacity = '0';

    // Void collapses
    tear.style.transition = 'all 0.3s cubic-bezier(0,0,0.2,1)';
    tear.style.width = '0px';
    tear.style.height = '0px';
    tear.style.boxShadow = '0 0 200px 100px rgba(124,92,252,0.4)';

    // Particles explode OUTWARD
    spawnParticles(30, false, 1);

    // Shockwave ring
    const sw = document.createElement('div');
    sw.style.cssText = 'position:absolute;top:50%;left:50%;width:40px;height:40px;border-radius:50%;border:3px solid rgba(124,92,252,0.6);transform:translate(-50%,-50%) scale(0.1);z-index:15;transition:all 0.6s ease-out;';
    stage.appendChild(sw);
    requestAnimationFrame(() => {
      sw.style.transform = 'translate(-50%,-50%) scale(12)';
      sw.style.opacity = '0';
    });

    // Flash
    const flash = document.createElement('div');
    flash.style.cssText = 'position:absolute;inset:0;background:rgba(124,92,252,0.3);z-index:20;opacity:1;transition:opacity 0.4s;border-radius:20px;';
    stage.appendChild(flash);
    t(() => { flash.style.opacity = '0'; }, 50);

    // Snap back to normal
    stage.style.transform = 'scale(1)';
    warp.style.opacity = '0';

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        numEl.style.transition = 'all 0.35s cubic-bezier(0.34,1.56,0.64,1)';
        numEl.style.transform = 'scale(1)';
        numEl.style.opacity = '1';
      });
    });

    haptic(60);
    t(() => { stage.style.transition = 'opacity 0.3s'; stage.style.opacity = '0'; }, 600);
  }, 2300);
}

play();
</script>
</body>
