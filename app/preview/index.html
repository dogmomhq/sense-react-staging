<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Countdown Concepts — Sense</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; color: #fff; min-height: 100vh; }

.selector { display: flex; gap: 8px; padding: 16px; flex-wrap: wrap; justify-content: center; background: #1a1a1a; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 1000; }
.selector button { padding: 10px 16px; border: 2px solid #444; border-radius: 12px; background: transparent; color: #ccc; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.selector button:hover { border-color: #888; color: #fff; }
.selector button.active { border-color: #7c5cfc; background: rgba(124,92,252,0.15); color: #fff; }

.concept-info { text-align: center; padding: 20px 16px 8px; }
.concept-info h2 { font-size: 20px; margin-bottom: 6px; }
.concept-info p { font-size: 14px; color: #888; max-width: 520px; margin: 0 auto; line-height: 1.5; }

.phone-frame { width: 380px; height: 720px; margin: 16px auto; border-radius: 40px; border: 4px solid #333; position: relative; overflow: hidden; background: #fafafa; }
.phone-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 160px; height: 30px; background: #111; border-radius: 0 0 20px 20px; z-index: 500; }

.countdown-stage { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 200; }

.replay-btn { display: block; margin: 16px auto 40px; padding: 14px 40px; background: #7c5cfc; border: none; border-radius: 14px; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
.replay-btn:hover { background: #6a4aed; }

.fake-game { position: absolute; inset: 0; padding: 80px 20px 20px; opacity: 0.15; }
.fake-header { text-align: center; font-size: 13px; font-weight: 600; color: #666; letter-spacing: 1px; margin-bottom: 30px; }
.fake-image { width: 200px; height: 200px; background: #e0e0e0; border-radius: 16px; margin: 0 auto 20px; }
.fake-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fake-option { height: 48px; background: #e8e8e8; border-radius: 12px; }
</style>
</head>
<body>

<div class="selector">
  <button class="active" onclick="pick(0)">1. Prowl</button>
  <button onclick="pick(1)">2. Stampede</button>
  <button onclick="pick(2)">3. Eyes</button>
  <button onclick="pick(3)">4. Pulse</button>
  <button onclick="pick(4)">5. Pounce</button>
</div>

<div class="concept-info" id="info"></div>
<div class="phone-frame" id="phone">
  <div class="phone-notch"></div>
  <div class="fake-game">
    <div class="fake-header">WHAT ANIMAL IS THIS?</div>
    <div class="fake-image"></div>
    <div class="fake-options"><div class="fake-option"></div><div class="fake-option"></div><div class="fake-option"></div><div class="fake-option"></div></div>
  </div>
  <div class="countdown-stage" id="stage"></div>
</div>
<button class="replay-btn" onclick="play()">▶ Replay</button>

<script>
let current = 0;
let timers = [];
let intervals = [];

const concepts = [
  {
    name: "The Prowl",
    desc: "A predator is stalking. Paw prints pad across the screen one by one — slow, deliberate, getting closer. Each footfall shakes the ground more. The numbers breathe like a crouching animal. On GO the predator POUNCES — claw marks slash across the screen revealing the question."
  },
  {
    name: "Stampede",
    desc: "Dust kicks up from the bottom. The ground rumbles — faintly at first. Hoofprints and animal silhouettes streak across the background, building speed. 3 is a distant tremor. 2 the herd is closer. 1 is a full stampede shaking everything. GO — they burst through the screen."
  },
  {
    name: "Predator Eyes",
    desc: "Screen goes dark like night jungle. Two glowing eyes appear — watching, blinking. On each count they get closer and more intense, the pupils narrow. Other eyes appear in the periphery. Foliage shadows shift. On GO the eyes lunge forward — the hunt is ON."
  },
  {
    name: "Heartbeat of the Wild",
    desc: "An animal heartbeat thumps — you see concentric ripples like sonar pings emanating from a paw print in the center. Each beat the print glows hotter, amber→orange→red. Tribal pattern rings expand outward. The rhythm accelerates like a cornered animal. GO — the heart ROARS."
  },
  {
    name: "The Pounce",
    desc: "A coiled spring. The number crouches LOW on each count — squashing down, compressing, loading energy. 3 dips slightly. 2 crouches deeper. 1 is fully loaded, vibrating with tension. GO — LAUNCHES upward with massive force, claw trails and motion blur streaking behind it."
  }
];

function haptic(ms) { if (navigator.vibrate) navigator.vibrate(ms); }
function pick(i) {
  current = i;
  document.querySelectorAll('.selector button').forEach((b,j) => b.classList.toggle('active', j===i));
  play();
}
function clearAll() {
  timers.forEach(clearTimeout); intervals.forEach(clearInterval);
  timers = []; intervals = [];
}
function t(fn, ms) { const id = setTimeout(fn, ms); timers.push(id); return id; }

function play() {
  clearAll();
  document.getElementById('info').innerHTML = `<h2>${concepts[current].name}</h2><p>${concepts[current].desc}</p>`;
  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  stage.style.cssText = '';
  [prowl, stampede, eyes, heartbeatWild, pounce][current](stage);
}

// ======== 1. THE PROWL ========
function prowl(stage) {
  stage.style.background = 'linear-gradient(180deg, #f5f0e8 0%, #e8dfd0 100%)';

  const numEl = document.createElement('div');
  numEl.style.cssText = 'font-size:140px;font-weight:900;color:#7c5cfc;z-index:10;position:relative;opacity:0;';
  stage.appendChild(numEl);

  const labelEl = document.createElement('div');
  labelEl.style.cssText = 'font-size:14px;font-weight:700;color:#999;letter-spacing:3px;text-transform:uppercase;margin-top:8px;z-index:10;opacity:0;';
  labelEl.textContent = 'GET READY';
  stage.appendChild(labelEl);

  // Paw print function
  function spawnPaw(x, y, size, delay, opacity) {
    t(() => {
      // Main pad
      const paw = document.createElement('div');
      paw.style.cssText = `position:absolute;left:${x}px;top:${y}px;z-index:5;opacity:0;transform:scale(0.5);transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);`;

      const pad = document.createElement('div');
      pad.style.cssText = `width:${size}px;height:${size*0.8}px;background:rgba(80,60,40,${opacity});border-radius:50% 50% 45% 45%;position:relative;`;

      // Toe beans
      const toes = [[0.15,-0.35],[0.5,-0.45],[0.85,-0.35],[0,-0.05],[1,-0.05]];
      toes.slice(0,4).forEach(([tx,ty]) => {
        const toe = document.createElement('div');
        const toeSize = size * 0.22;
        toe.style.cssText = `position:absolute;width:${toeSize}px;height:${toeSize}px;background:rgba(80,60,40,${opacity});border-radius:50%;left:${tx*size-toeSize/2}px;top:${ty*size}px;`;
        pad.appendChild(toe);
      });

      paw.appendChild(pad);
      stage.appendChild(paw);

      requestAnimationFrame(() => {
        paw.style.opacity = '1';
        paw.style.transform = 'scale(1)';
      });

      // Ground impact
      const shk = size * 0.08;
      stage.style.transform = `translate(${(Math.random()-0.5)*shk}px, ${shk*0.5}px)`;
      t(() => { stage.style.transform = ''; }, 100);
      haptic(Math.floor(size * 0.3));
    }, delay);
  }

  // Paw prints walking across — getting bigger (closer)
  spawnPaw(80, 520, 22, 100, 0.15);
  spawnPaw(160, 480, 24, 300, 0.18);
  spawnPaw(100, 420, 28, 500, 0.22);

  // 3
  t(() => {
    numEl.textContent = '3';
    numEl.style.opacity = '1';
    labelEl.style.opacity = '1';
    numEl.style.transition = 'none';
    numEl.style.transform = 'scale(1.1)';
    requestAnimationFrame(() => {
      numEl.style.transition = 'all 0.5s cubic-bezier(0.34,1.56,0.64,1)';
      numEl.style.transform = 'scale(0.95)';
    });
  }, 100);

  spawnPaw(220, 370, 32, 700, 0.25);
  spawnPaw(140, 300, 36, 850, 0.3);

  // 2
  t(() => {
    numEl.textContent = '2';
    numEl.style.transition = 'none';
    numEl.style.transform = 'scale(1.15)';
    requestAnimationFrame(() => {
      numEl.style.transition = 'all 0.5s cubic-bezier(0.34,1.56,0.64,1)';
      numEl.style.transform = 'scale(0.93)';
    });
    haptic(20);
  }, 900);

  spawnPaw(260, 260, 42, 1100, 0.35);
  spawnPaw(170, 200, 48, 1350, 0.4);

  // 1 — it's RIGHT HERE
  t(() => {
    numEl.textContent = '1';
    numEl.style.transition = 'none';
    numEl.style.transform = 'scale(1.3)';
    requestAnimationFrame(() => {
      numEl.style.transition = 'all 0.5s cubic-bezier(0.34,1.56,0.64,1)';
      numEl.style.transform = 'scale(0.9)';
    });

    // Tension vibration
    let vc = 0;
    const vib = setInterval(() => {
      vc++;
      const v = 1.5 + vc * 0.3;
      stage.style.transform = `translate(${(Math.random()-0.5)*v}px, ${(Math.random()-0.5)*v*0.5}px)`;
      if (vc > 18) { clearInterval(vib); stage.style.transform = ''; }
    }, 30);
    intervals.push(vib);
    haptic(30);
  }, 1600);

  // Biggest print right in center
  spawnPaw(155, 340, 55, 1650, 0.5);

  // GO — CLAW SLASH
  t(() => {
    numEl.style.opacity = '0';
    labelEl.style.opacity = '0';

    // Claw marks
    for (let i = 0; i < 3; i++) {
      const claw = document.createElement('div');
      const startX = 120 + i * 60;
      claw.style.cssText = `
        position:absolute;left:${startX}px;top:-50px;width:8px;height:0;
        background:linear-gradient(180deg, transparent, rgba(200,80,20,0.6), rgba(200,80,20,0.8), transparent);
        z-index:20;border-radius:4px;transform:rotate(${-5+i*5}deg);
        transition:height 0.2s ease-in;
      `;
      stage.appendChild(claw);
      t(() => { claw.style.height = '820px'; }, i * 40);
    }

    // Flash
    const flash = document.createElement('div');
    flash.style.cssText = 'position:absolute;inset:0;background:rgba(255,255,255,0.8);z-index:25;opacity:1;transition:opacity 0.3s;';
    stage.appendChild(flash);
    t(() => { flash.style.opacity = '0'; }, 100);

    // GO text
    t(() => {
      const go = document.createElement('div');
      go.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.5);font-size:80px;font-weight:900;color:#22c55e;z-index:30;opacity:0;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);';
      go.textContent = 'GO';
      stage.appendChild(go);
      requestAnimationFrame(() => { go.style.transform = 'translate(-50%,-50%) scale(1)'; go.style.opacity = '1'; });
    }, 80);

    haptic(60);
    t(() => { stage.style.transition = 'opacity 0.3s'; stage.style.opacity = '0'; }, 700);
  }, 2300);
}

// ======== 2. STAMPEDE ========
function stampede(stage) {
  stage.style.background = 'linear-gradient(180deg, #e8dfd0 0%, #d4c4a8 60%, #c4a872 100%)';

  const numEl = document.createElement('div');
  numEl.style.cssText = 'font-size:140px;font-weight:900;color:#7c5cfc;z-index:10;position:relative;opacity:0;text-shadow:0 2px 20px rgba(124,92,252,0.3);';
  stage.appendChild(numEl);

  const labelEl = document.createElement('div');
  labelEl.style.cssText = 'font-size:14px;font-weight:700;color:#8a7a60;letter-spacing:3px;text-transform:uppercase;margin-top:8px;z-index:10;opacity:0;';
  labelEl.textContent = 'GET READY';
  stage.appendChild(labelEl);

  // Dust layer at bottom
  const dustLayer = document.createElement('div');
  dustLayer.style.cssText = 'position:absolute;bottom:0;left:0;width:100%;height:0;background:linear-gradient(0deg, rgba(180,150,100,0.6) 0%, rgba(180,150,100,0.3) 50%, transparent 100%);z-index:4;transition:height 0.5s ease;';
  stage.appendChild(dustLayer);

  // Animal silhouettes
  const silhouettes = ['🦬','🐘','🦏','🐃','🫎','🦌','🐎','🦓'];

  function spawnSilhouette(delay, speed, y, size, opacity) {
    t(() => {
      const s = document.createElement('div');
      const animal = silhouettes[Math.floor(Math.random()*silhouettes.length)];
      const fromLeft = Math.random() > 0.5;
      s.style.cssText = `
        position:absolute;top:${y}px;${fromLeft?'left:-60px':'right:-60px'};
        font-size:${size}px;z-index:3;opacity:${opacity};
        filter:brightness(0) opacity(${opacity});
        transition:${fromLeft?'left':'right'} ${speed}s linear;
      `;
      s.textContent = animal;
      stage.appendChild(s);
      requestAnimationFrame(() => {
        s.style[fromLeft?'left':'right'] = '420px';
      });
      setTimeout(() => s.remove(), speed * 1000 + 100);
    }, delay);
  }

  function dustPuff(x, y, count) {
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div');
      const size = 8 + Math.random() * 20;
      d.style.cssText = `
        position:absolute;left:${x + (Math.random()-0.5)*60}px;top:${y}px;
        width:${size}px;height:${size}px;background:rgba(180,150,100,${0.2+Math.random()*0.3});
        border-radius:50%;z-index:6;opacity:1;
        transition:all ${0.4+Math.random()*0.4}s ease-out;
      `;
      stage.appendChild(d);
      requestAnimationFrame(() => {
        d.style.transform = `translate(${(Math.random()-0.5)*40}px, ${-30-Math.random()*50}px)`;
        d.style.opacity = '0';
      });
      setTimeout(() => d.remove(), 800);
    }
  }

  // 3 — distant tremor
  t(() => {
    numEl.textContent = '3'; numEl.style.opacity = '1'; labelEl.style.opacity = '1';
    numEl.style.transition = 'none'; numEl.style.transform = 'scale(1.3)';
    requestAnimationFrame(() => { numEl.style.transition = 'all 0.4s cubic-bezier(0.34,1.56,0.64,1)'; numEl.style.transform = 'scale(1)'; });
    dustLayer.style.height = '60px';
    const shk = 2;
    stage.style.transform = `translateY(${shk}px)`;
    t(() => { stage.style.transform = ''; }, 80);
    haptic(10);
    dustPuff(190, 650, 4);
  }, 100);

  spawnSilhouette(200, 1.5, 580, 28, 0.15);
  spawnSilhouette(400, 1.2, 560, 32, 0.2);

  // 2 — getting closer
  t(() => {
    numEl.textContent = '2';
    numEl.style.transition = 'none'; numEl.style.transform = 'scale(1.4)';
    requestAnimationFrame(() => { numEl.style.transition = 'all 0.4s cubic-bezier(0.34,1.56,0.64,1)'; numEl.style.transform = 'scale(1)'; });
    dustLayer.style.height = '140px';
    const shk = 5;
    stage.style.transform = `translateY(${shk}px)`;
    t(() => { stage.style.transform = ''; }, 100);
    haptic(20);
    dustPuff(120, 620, 6);
    dustPuff(260, 630, 6);
  }, 900);

  spawnSilhouette(950, 0.9, 540, 36, 0.25);
  spawnSilhouette(1050, 0.8, 520, 40, 0.3);
  spawnSilhouette(1150, 1.0, 550, 34, 0.22);

  // 1 — full stampede
  t(() => {
    numEl.textContent = '1';
    numEl.style.transition = 'none'; numEl.style.transform = 'scale(1.6)';
    requestAnimationFrame(() => { numEl.style.transition = 'all 0.4s cubic-bezier(0.34,1.56,0.64,1)'; numEl.style.transform = 'scale(1)'; });
    dustLayer.style.height = '250px';
    haptic(35);
    dustPuff(100, 600, 8);
    dustPuff(200, 590, 8);
    dustPuff(300, 610, 8);

    // Constant rumble
    let rc = 0;
    const rumble = setInterval(() => {
      rc++;
      const v = 3 + Math.random() * 5;
      stage.style.transform = `translate(${(Math.random()-0.5)*v}px, ${Math.random()*v*0.5}px)`;
      if (rc > 20) { clearInterval(rumble); stage.style.transform = ''; }
    }, 30);
    intervals.push(rumble);
  }, 1600);

  // Rapid silhouettes during 1
  for (let i = 0; i < 6; i++) {
    spawnSilhouette(1650 + i*60, 0.5, 480 + Math.random()*80, 42+Math.random()*20, 0.3+Math.random()*0.15);
  }

  // GO — burst through
  t(() => {
    numEl.style.opacity = '0'; labelEl.style.opacity = '0';
    dustLayer.style.height = '720px';
    dustLayer.style.background = 'linear-gradient(0deg, rgba(180,150,100,0.8) 0%, rgba(180,150,100,0.4) 60%, transparent 100%)';

    // Big silhouettes charging through
    for (let i = 0; i < 4; i++) {
      const s = document.createElement('div');
      s.style.cssText = `
        position:absolute;top:${300+i*40}px;left:${-80+i*30}px;
        font-size:${60+i*10}px;z-index:${15+i};opacity:0.5;
        filter:brightness(0) opacity(0.4);
        transition:all 0.35s ease-in;
      `;
      s.textContent = silhouettes[i];
      stage.appendChild(s);
      t(() => { s.style.left = '440px'; s.style.opacity = '0'; }, i * 50);
    }

    // Flash
    const flash = document.createElement('div');
    flash.style.cssText = 'position:absolute;inset:0;background:rgba(255,255,255,0.7);z-index:25;opacity:1;transition:opacity 0.35s;';
    stage.appendChild(flash);
    t(() => { flash.style.opacity = '0'; }, 120);

    const go = document.createElement('div');
    go.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0.3);font-size:80px;font-weight:900;color:#22c55e;z-index:30;opacity:0;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);';
    go.textContent = 'GO';
    stage.appendChild(go);
    t(() => { go.style.transform = 'translate(-50%,-50%) scale(1)'; go.style.opacity = '1'; }, 50);

    haptic(60);
    t(() => { stage.style.transition = 'opacity 0.3s'; stage.style.opacity = '0'; }, 700);
  }, 2300);
}

// ======== 3. PREDATOR EYES ========
function eyes(stage) {
  stage.style.background = '#0a0f0a';
  stage.style.transition = 'background 0.5s';

  // Foliage shadows
  const foliage = document.createElement('div');
  foliage.style.cssText = `position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0.3;
    background:radial-gradient(ellipse at 20% 30%, rgba(20,60,20,0.4) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(20,60,20,0.3) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 90%, rgba(20,60,20,0.5) 0%, transparent 40%);`;
  stage.appendChild(foliage);

  const numEl = document.createElement('div');
  numEl.style.cssText = 'font-size:120px;font-weight:900;color:rgba(124,92,252,0.8);z-index:10;position:relative;opacity:0;text-shadow:0 0 40px rgba(124,92,252,0.4);';
  stage.appendChild(numEl);

  const labelEl = document.createElement('div');
  labelEl.style.cssText = 'font-size:14px;font-weight:700;color:rgba(150,180,150,0.5);letter-spacing:3px;text-transform:uppercase;margin-top:8px;z-index:10;opacity:0;';
  labelEl.textContent = 'GET READY';
  stage.appendChild(labelEl);

  function spawnEyes(x, y, size, delay, color, blinkDelay) {
    t(() => {
      const eyePair = document.createElement('div');
      eyePair.style.cssText = `position:absolute;left:${x}px;top:${y}px;z-index:5;display:flex;gap:${size*0.8}px;opacity:0;transition:opacity 0.3s;`;

      for (let i = 0; i < 2; i++) {
        const eye = document.createElement('div');
        eye.style.cssText = `
          width:${size}px;height:${size*0.55}px;background:${color};
          border-radius:50%;position:relative;
          box-shadow:0 0 ${size}px ${size*0.3}px ${color.replace('1)','0.3)')};
        `;
        // Pupil
        const pupil = document.createElement('div');
        pupil.style.cssText = `
          position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
          width:${size*0.35}px;height:${size*0.7}px;background:#000;
          border-radius:50%;
        `;
        eye.appendChild(pupil);
        eyePair.appendChild(eye);
      }

      stage.appendChild(eyePair);
      requestAnimationFrame(() => { eyePair.style.opacity = '1'; });

      // Blink
      if (blinkDelay) {
        t(() => {
          eyePair.style.transition = 'opacity 0.08s';
          eyePair.style.opacity = '0.1';
          t(() => { eyePair.style.opacity = '1'; }, 100);
        }, blinkDelay);
      }
    }, delay);
  }

  // 3 — distant eyes appear
  t(() => {
    numEl.textContent = '3'; numEl.style.opacity = '1'; labelEl.style.opacity = '1';
    numEl.style.transition = 'none'; numEl.style.transform = 'scale(1.5)'; numEl.style.opacity = '0';
    requestAnimationFrame(() => { numEl.style.transition = 'all 0.4s cubic-bezier(0.34,1.56,0.64,1)'; numEl.style.transform = 'scale(1)'; numEl.style.opacity = '1'; });
    haptic(8);
  }, 100);
  spawnEyes(260, 180, 10, 200, 'rgba(200,180,50,1)', 500);
  spawnEyes(60, 450, 8, 400, 'rgba(180,200,60,1)', 600);

  // 2 — closer, bigger, more
  t(() => {
    numEl.textContent = '2';
    numEl.style.transition = 'none'; numEl.style.transform = 'scale(1.5)'; numEl.style.opacity = '0';
    requestAnimationFrame(() => { numEl.style.transition = 'all 0.4s cubic-bezier(0.34,1.56,0.64,1)'; numEl.style.transform = 'scale(1)'; numEl.style.opacity = '1'; });
    stage.style.background = '#060a06';
    haptic(15);
  }, 900);
  spawnEyes(100, 250, 14, 950, 'rgba(220,180,40,1)', 400);
  spawnEyes(280, 400, 12, 1050, 'rgba(200,60,30,1)', 300);
  spawnEyes(40, 330, 10, 1100, 'rgba(180,200,50,1)', null);

  // 1 — they're everywhere, the main pair is HUGE and close
  t(() => {
    numEl.textContent = '1';
    numEl.style.transition = 'none'; numEl.style.transform = 'scale(1.5)'; numEl.style.opacity = '0';
    numEl.style.color = 'rgba(200,50,50,0.9)';
    numEl.style.textShadow = '0 0 60px rgba(200,50,50,0.5)';
    requestAnimationFrame(() => { numEl.style.transition = 'all 0.4s cubic-bezier(0.34,1.56,0.64,1)'; numEl.style.transform = 'scale(1)'; numEl.style.opacity = '1'; });
    stage.style.background = '#030503';
    haptic(30);

    // Tension shake
    let vc = 0;
    const vib = setInterval(() => {
      vc++;
      stage.style.transform = `translate(${(Math.random()-0.5)*3}px, ${(Math.random()-0.5)*2}px)`;
      if (vc > 18) { clearInterval(vib); stage.style.transform = ''; }
    }, 30);
    intervals.push(vib);
  }, 1600);

  // Big predator eyes in center
  spawnEyes(130, 310, 24, 1650, 'rgba(240,180,30,1)', 300);
  spawnEyes(300, 500, 11, 1700, 'rgba(180,220,50,1)', null);
  spawnEyes(20, 160, 9, 1750, 'rgba(200,60,40,1)', null);

  // GO — eyes LUNGE
  t(() => {
    numEl.style.opacity = '0'; labelEl.style.opacity = '0';

    // All eyes rapidly grow and fade (lunge forward)
    document.querySelectorAll('#stage > div').forEach(el => {
      if (el.style.display === 'flex') {
        el.style.transition = 'all 0.25s ease-in';
        el.style.transform = 'scale(3)';
        el.style.opacity = '0';
      }
    });

    // White flash (dawn breaks)
    const flash = document.createElement('div');
    flash.style.cssText = 'position:absolute;inset:0;background:rgba(255,255,255,0.9);z-index:25;opacity:0;transition:opacity 0.15s;';
    stage.appendChild(flash);
    t(() => { flash.style.opacity = '1'; }, 50);

    const go = document.createElement('div');
    go.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(3);font-size:80px;font-weight:900;color:#22c55e;z-index:30;opacity:0;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);';
    go.textContent = 'GO';
    stage.appendChild(go);
    t(() => { go.style.transform = 'translate(-50%,-50%) scale(1)'; go.style.opacity = '1'; }, 100);

    haptic(60);
    t(() => { stage.style.transition = 'opacity 0.3s'; stage.style.opacity = '0'; }, 700);
  }, 2300);
}

// ======== 4. HEARTBEAT OF THE WILD ========
function heartbeatWild(stage) {
  stage.style.background = '#faf8f4';

  const numEl = document.createElement('div');
  numEl.style.cssText = 'font-size:140px;font-weight:900;color:#7c5cfc;z-index:10;position:relative;opacity:0;';
  stage.appendChild(numEl);

  const labelEl = document.createElement('div');
  labelEl.style.cssText = 'font-size:14px;font-weight:700;color:#999;letter-spacing:3px;text-transform:uppercase;margin-top:8px;z-index:10;opacity:0;';
  labelEl.textContent = 'GET READY';
  stage.appendChild(labelEl);

  // Central paw print (static, glows)
  const pawCenter = document.createElement('div');
  pawCenter.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:60px;z-index:3;opacity:0.15;filter:grayscale(1);transition:all 0.3s;';
  pawCenter.textContent = '🐾';
  stage.appendChild(pawCenter);

  // Tribal/organic ring function
  function pulseRing(delay, size, color, width, duration) {
    t(() => {
      const ring = document.createElement('div');
      ring.style.cssText = `
        position:absolute;top:50%;left:50%;width:${size}px;height:${size}px;
        border-radius:50%;border:${width}px solid ${color};
        transform:translate(-50%,-50%) scale(0.1);opacity:0.8;z-index:4;
        transition:all ${duration}s cubic-bezier(0,0,0.2,1);pointer-events:none;
      `;
      stage.appendChild(ring);
      requestAnimationFrame(() => {
        ring.style.transform = 'translate(-50%,-50%) scale(1)';
        ring.style.opacity = '0';
      });
      setTimeout(() => ring.remove(), duration * 1000 + 100);
    }, delay);
  }

  function beat(num, delay, intensity, pawColor) {
    t(() => {
      numEl.textContent = num; numEl.style.opacity = '1'; labelEl.style.opacity = '1';
      numEl.style.transition = 'none';
      numEl.style.transform = 'scale(1.8)';
      numEl.style.opacity = '0';

      // Double-beat like a real heartbeat (lub-dub)
      requestAnimationFrame(() => {
        numEl.style.transition = 'all 0.15s cubic-bezier(0.34,1.56,0.64,1)';
        numEl.style.transform = 'scale(1.1)';
        numEl.style.opacity = '1';
      });
      // Second beat (dub)
      t(() => {
        numEl.style.transition = 'all 0.12s cubic-bezier(0.34,1.56,0.64,1)';
        numEl.style.transform = 'scale(0.92)';
        t(() => {
          numEl.style.transition = 'all 0.3s ease';
          numEl.style.transform = 'scale(1)';
        }, 80);
      }, 160);

      // Paw glows
      pawCenter.style.opacity = String(0.15 + intensity * 0.5);
      pawCenter.style.filter = `grayscale(${1 - intensity}) hue-rotate(${intensity * -30}deg) brightness(${0.8 + intensity * 0.8})`;
      t(() => { pawCenter.style.opacity = String(0.1 + intensity * 0.2); }, 300);

      // Shake — thump downward like a heartbeat
      const shk = 3 + intensity * 10;
      stage.style.transform = `translateY(${shk}px)`;
      stage.style.transition = 'transform 0.08s ease-in';
      t(() => {
        stage.style.transition = 'transform 0.25s cubic-bezier(0.34,1.56,0.64,1)';
        stage.style.transform = '';
      }, 80);

      // Background warms
      const warmth = Math.floor(intensity * 15);
      stage.style.background = `rgb(${250+warmth*0.3}, ${248-warmth}, ${244-warmth*2})`;

      haptic(Math.floor(10 + intensity * 40));
    }, delay);
  }

  // 3 — calm beat
  beat('3', 100, 0.2, '#c4956a');
  pulseRing(100, 200, 'rgba(196,149,106,0.3)', 2, 0.7);

  // 2 — faster, stronger
  beat('2', 900, 0.55, '#c47a4a');
  pulseRing(900, 200, 'rgba(196,122,74,0.4)', 3, 0.6);
  pulseRing(950, 260, 'rgba(196,122,74,0.2)', 2, 0.7);

  // 1 — pounding
  beat('1', 1600, 1.0, '#c45a30');
  pulseRing(1600, 200, 'rgba(200,80,40,0.5)', 4, 0.5);
  pulseRing(1650, 280, 'rgba(200,80,40,0.35)', 3, 0.6);
  pulseRing(1700, 360, 'rgba(200,80,40,0.2)', 2, 0.7);

  // Rapid double-beats during 1
  t(() => {
    let rc = 0;
    const rapid = setInterval(() => {
      rc++;
      const v = 2 + rc * 0.5;
      stage.style.transform = `translate(${(Math.random()-0.5)*v}px, ${Math.random()*v}px)`;
      if (rc > 15) { clearInterval(rapid); stage.style.transform = ''; }
    }, 35);
    intervals.push(rapid);
  }, 1800);

  // GO — the heart ROARS
  t(() => {
    numEl.textContent = 'GO';
    numEl.style.fontSize = '80px';
    numEl.style.color = '#22c55e';
    numEl.style.transition = 'none';
    numEl.style.transform = 'scale(0.3)';
    numEl.style.opacity = '0';
    labelEl.style.opacity = '0';

    pawCenter.style.opacity = '0.7';
    pawCenter.style.filter = 'none';
    pawCenter.style.transform = 'translate(-50%,-50%) scale(1.5)';

    // Burst rings
    for (let i = 0; i < 5; i++) {
      pulseRing(2300 + i * 30, 100 + i * 40, `rgba(34,197,94,${0.5-i*0.08})`, 3, 0.6);
    }

    const flash = document.createElement('div');
    flash.style.cssText = 'position:absolute;inset:0;background:rgba(34,197,94,0.2);z-index:20;opacity:1;transition:opacity 0.3s;';
    stage.appendChild(flash);
    t(() => { flash.style.opacity = '0'; }, 100);

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        numEl.style.transition = 'all 0.3s cubic-bezier(0.34,1.56,0.64,1)';
        numEl.style.transform = 'scale(1)';
        numEl.style.opacity = '1';
      });
    });

    haptic(60);
    stage.style.background = '#faf8f4';
    t(() => { stage.style.transition = 'opacity 0.3s'; stage.style.opacity = '0'; }, 700);
  }, 2300);
}

// ======== 5. THE POUNCE ========
function pounce(stage) {
  stage.style.background = '#fff';

  const numEl = document.createElement('div');
  numEl.style.cssText = 'font-size:140px;font-weight:900;color:#7c5cfc;z-index:10;position:relative;opacity:0;';
  stage.appendChild(numEl);

  const labelEl = document.createElement('div');
  labelEl.style.cssText = 'font-size:14px;font-weight:700;color:#999;letter-spacing:3px;text-transform:uppercase;margin-top:8px;z-index:10;opacity:0;';
  labelEl.textContent = 'GET READY';
  stage.appendChild(labelEl);

  // Energy lines (coiled spring feel)
  const springContainer = document.createElement('div');
  springContainer.style.cssText = 'position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden;';
  stage.appendChild(springContainer);

  // Motion blur streaks container
  const streaks = document.createElement('div');
  streaks.style.cssText = 'position:absolute;inset:0;z-index:15;pointer-events:none;overflow:hidden;opacity:0;';
  stage.appendChild(streaks);

  function coil(num, delay, crouchAmount, intensity) {
    t(() => {
      numEl.textContent = num; numEl.style.opacity = '1'; labelEl.style.opacity = '1';

      // Number DROPS from above and squashes on landing
      numEl.style.transition = 'none';
      numEl.style.transform = `translateY(-100px) scaleY(1.3) scaleX(0.85)`;
      numEl.style.opacity = '0';

      requestAnimationFrame(() => {
        numEl.style.transition = 'transform 0.2s cubic-bezier(0.6, 0, 1, 1), opacity 0.1s';
        numEl.style.transform = `translateY(${crouchAmount}px) scaleY(${0.7 - intensity*0.1}) scaleX(${1.15 + intensity*0.1})`;
        numEl.style.opacity = '1';

        // Bounce back but stay crouched
        t(() => {
          numEl.style.transition = 'transform 0.4s cubic-bezier(0.34,1.56,0.64,1)';
          numEl.style.transform = `translateY(${crouchAmount * 0.6}px) scaleY(${0.85 - intensity*0.05}) scaleX(${1.05 + intensity*0.05})`;
        }, 200);
      });

      // Compression lines (spring energy)
      for (let i = 0; i < Math.floor(2 + intensity * 4); i++) {
        const line = document.createElement('div');
        const y = 400 + crouchAmount + (i * 15);
        line.style.cssText = `
          position:absolute;left:${100 + Math.random()*180}px;top:${y}px;
          width:${40 + Math.random()*60}px;height:2px;
          background:rgba(124,92,252,${0.1 + intensity*0.15});
          border-radius:1px;z-index:4;opacity:0;
          transition:all 0.3s ease;
        `;
        springContainer.appendChild(line);
        requestAnimationFrame(() => { line.style.opacity = '1'; });
        t(() => { line.style.opacity = '0'; }, 400);
        setTimeout(() => line.remove(), 700);
      }

      // Ground impact shadow
      const shadow = document.createElement('div');
      shadow.style.cssText = `
        position:absolute;top:${420+crouchAmount}px;left:50%;
        width:${60 + intensity*80}px;height:${8 + intensity*6}px;
        background:rgba(0,0,0,${0.05+intensity*0.08});
        border-radius:50%;transform:translateX(-50%);z-index:2;
        transition:all 0.3s ease;
      `;
      stage.appendChild(shadow);
      t(() => { shadow.style.opacity = '0'; }, 500);
      setTimeout(() => shadow.remove(), 800);

      // Shake on landing
      const shk = 3 + intensity * 8;
      stage.style.transform = `translateY(${shk * 0.5}px)`;
      t(() => {
        stage.style.transition = 'transform 0.2s cubic-bezier(0.34,1.56,0.64,1)';
        stage.style.transform = '';
        t(() => { stage.style.transition = ''; }, 200);
      }, 60);

      haptic(Math.floor(10 + intensity * 35));

      // Vibrate while coiled on 1
      if (num === '1') {
        let vc = 0;
        const vib = setInterval(() => {
          vc++;
          const v = 1 + vc * 0.4;
          numEl.style.transform = `translateY(${crouchAmount*0.6}px) scaleY(${0.8-vc*0.005}) scaleX(${1.1+vc*0.005}) translate(${(Math.random()-0.5)*v}px, ${(Math.random()-0.5)*v*0.3}px)`;
          if (vc > 16) clearInterval(vib);
        }, 30);
        intervals.push(vib);
      }
    }, delay);
  }

  // Each count crouches deeper
  coil('3', 100, 15, 0.2);
  coil('2', 900, 35, 0.55);
  coil('1', 1600, 60, 1.0);

  // GO — LAUNCH upward with massive force
  t(() => {
    labelEl.style.opacity = '0';
    // Clear spring lines
    springContainer.innerHTML = '';

    numEl.textContent = 'GO';
    numEl.style.fontSize = '80px';
    numEl.style.color = '#22c55e';
    numEl.style.transition = 'none';
    numEl.style.transform = 'translateY(80px) scaleY(0.5) scaleX(1.4)';

    // Motion blur streaks
    streaks.style.opacity = '1';
    for (let i = 0; i < 12; i++) {
      const streak = document.createElement('div');
      streak.style.cssText = `
        position:absolute;left:${80+Math.random()*220}px;top:0;
        width:${2+Math.random()*3}px;height:100%;
        background:linear-gradient(180deg, transparent 0%, rgba(124,92,252,${0.1+Math.random()*0.15}) 30%, rgba(34,197,94,${0.1+Math.random()*0.1}) 70%, transparent 100%);
      `;
      streaks.appendChild(streak);
    }

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        // LAUNCH — spring upward
        numEl.style.transition = 'all 0.25s cubic-bezier(0.34,1.56,0.64,1)';
        numEl.style.transform = 'translateY(-20px) scaleY(1.1) scaleX(0.95)';

        // Settle
        t(() => {
          numEl.style.transition = 'all 0.2s ease';
          numEl.style.transform = 'translateY(0) scaleY(1) scaleX(1)';
          streaks.style.transition = 'opacity 0.3s';
          streaks.style.opacity = '0';
        }, 250);
      });
    });

    // Upward shockwave
    const wave = document.createElement('div');
    wave.style.cssText = `
      position:absolute;bottom:0;left:0;width:100%;height:10px;
      background:rgba(34,197,94,0.3);z-index:20;
      transition:all 0.3s ease-out;
    `;
    stage.appendChild(wave);
    requestAnimationFrame(() => { wave.style.height = '720px'; wave.style.opacity = '0'; });

    haptic(60);
    t(() => { stage.style.transition = 'opacity 0.3s'; stage.style.opacity = '0'; }, 700);
  }, 2300);
}

play();
</script>
