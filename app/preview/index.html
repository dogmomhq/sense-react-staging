<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown Tension Concepts — Sense</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #111; color: #fff; min-height: 100vh; }

.selector { display: flex; gap: 8px; padding: 16px; flex-wrap: wrap; justify-content: center; background: #1a1a1a; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
.selector button { padding: 10px 16px; border: 2px solid #444; border-radius: 12px; background: transparent; color: #ccc; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.selector button:hover { border-color: #888; color: #fff; }
.selector button.active { border-color: #7c5cfc; background: rgba(124,92,252,0.15); color: #fff; }

.concept-info { text-align: center; padding: 20px 16px 8px; }
.concept-info h2 { font-size: 20px; margin-bottom: 6px; }
.concept-info p { font-size: 14px; color: #888; max-width: 500px; margin: 0 auto; }

.stage-wrap { display: flex; justify-content: center; padding: 16px; }
.stage { width: 380px; height: 500px; background: #fafafa; border-radius: 20px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 40px; }

.replay-btn { display: block; margin: 16px auto; padding: 12px 32px; background: #7c5cfc; border: none; border-radius: 12px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
.replay-btn:hover { background: #6a4aed; }

.outcome-btns { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
.outcome-btns button { padding: 8px 16px; border: 1px solid #444; border-radius: 8px; background: transparent; color: #ccc; font-size: 12px; cursor: pointer; }
.outcome-btns button.active { border-color: #7c5cfc; background: rgba(124,92,252,0.15); color: #fff; }

/* Shared animation elements */
.cr-answers { position: absolute; top: 30px; left: 50%; transform: translateX(-50%); width: 90%; text-align: center; transition: all 0.4s cubic-bezier(0,0,0.2,1); }
.cr-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; transition: all 0.4s ease; opacity: 0; transform: translateY(20px); }
.cr-label { font-size: 11px; font-weight: 700; color: #999; letter-spacing: 1px; }
.cr-answer { font-size: 18px; font-weight: 800; }
.cr-divider { height: 1px; background: #e0e0e0; margin: 0 16px; opacity: 0; transition: opacity 0.3s; }
.cr-opp-answer { filter: blur(8px); transition: filter 0.3s; }
.cr-opp-status { font-size: 11px; font-weight: 700; opacity: 0; transition: opacity 0.3s; }

/* Race bars */
.cr-race { display: none; opacity: 0; transform: translateY(20px); transition: all 0.4s ease; position: absolute; top: 40px; left: 50%; transform: translateX(-50%); width: 85%; }
.cr-race-row { display: flex; align-items: center; margin: 10px 0; gap: 10px; }
.cr-race-label { font-size: 11px; font-weight: 700; color: #999; width: 50px; letter-spacing: 0.5px; }
.cr-bar-track { flex: 1; height: 28px; background: #eee; border-radius: 14px; overflow: hidden; position: relative; }
.cr-bar-fill { height: 100%; width: 0%; border-radius: 14px; transition: none; }
.cr-bar-you { background: #7c5cfc; }
.cr-bar-opp { background: #aaa; }
.cr-time { font-size: 14px; font-weight: 700; color: #333; width: 50px; text-align: right; font-variant-numeric: tabular-nums; }
.cr-gap { text-align: center; font-size: 13px; font-weight: 700; color: #7c5cfc; opacity: 0; transition: opacity 0.3s; margin-top: 4px; }

/* Wrong stamp */
.cr-wrong-stamp { position: absolute; font-size: 64px; font-weight: 900; color: rgba(239,68,68,0.7); top: 15%; left: 50%; transform: translate(-50%,-50%) scale(3) rotate(-15deg); opacity: 0; transition: all 0.25s cubic-bezier(0.34,1.56,0.64,1); pointer-events: none; z-index: 5; }
.cr-wrong-stamp.cr-slam { transform: translate(-50%,-50%) scale(1) rotate(-15deg); opacity: 1; }

/* Flash */
.cr-flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; z-index: 20; border-radius: 20px; }
.cr-flash-go { animation: crFlash 0.5s ease-out forwards; }
@keyframes crFlash { from { opacity: 1; } to { opacity: 0; } }

/* Shockwave */
.cr-shockwave { position: absolute; width: 60px; height: 60px; border-radius: 50%; border: 3px solid; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0.1); opacity: 0; pointer-events: none; z-index: 15; }
.cr-sw-go { animation: crSW 0.7s ease-out forwards; }
@keyframes crSW { 0% { transform: translate(-50%,-50%) scale(0.1); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(4); opacity: 0; } }

/* Confetti */
.cr-confetti { position: absolute; border-radius: 2px; pointer-events: none; z-index: 12; }
.cr-pop { animation: crPop 0.6s cubic-bezier(0.25,0.46,0.45,0.94) forwards; }
@keyframes crPop { 0% { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(0.3); opacity: 0; } }
.cr-fall { animation: crFall 0.9s ease-in forwards; }
@keyframes crFall { 0% { transform: translate(0,0) rotate(0deg); opacity: 0.7; } 100% { transform: translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity: 0; } }

/* Concept-specific: Heartbeat */
.heartbeat-line { position: absolute; bottom: 30px; left: 0; width: 100%; height: 60px; z-index: 8; pointer-events: none; }
.heartbeat-dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: #ef4444; top: 50%; left: 0; transform: translate(-50%, -50%); z-index: 9; filter: drop-shadow(0 0 6px rgba(239,68,68,0.8)); }
.heartbeat-vignette { position: absolute; inset: 0; border-radius: 20px; pointer-events: none; z-index: 7; opacity: 0; transition: opacity 0.15s; background: radial-gradient(ellipse at center, transparent 40%, rgba(239,68,68,0.15) 100%); }

/* Concept: Pressure Gauge */
.pressure-ring { position: absolute; width: 320px; height: 320px; border-radius: 50%; border: 4px solid transparent; top: 50%; left: 50%; transform: translate(-50%,-50%); pointer-events: none; z-index: 6; transition: border-color 0.1s; }
.pressure-glow { position: absolute; inset: 0; border-radius: 20px; pointer-events: none; z-index: 6; opacity: 0; background: radial-gradient(ellipse at center, transparent 30%, rgba(255,100,0,0.2) 100%); }
.pressure-text { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 36px; font-weight: 900; color: rgba(255,100,0,0.6); z-index: 8; font-variant-numeric: tabular-nums; letter-spacing: -2px; }

/* Concept: Fuse */
.fuse-container { position: absolute; bottom: 40px; left: 20px; right: 20px; height: 6px; background: #ddd; border-radius: 3px; z-index: 8; overflow: visible; }
.fuse-burn { height: 100%; width: 0%; background: linear-gradient(90deg, #333 0%, #ef4444 80%, #ff6600 100%); border-radius: 3px; position: relative; }
.fuse-spark { position: absolute; right: -2px; top: 50%; width: 12px; height: 12px; background: #ffaa00; border-radius: 50%; transform: translateY(-50%); filter: drop-shadow(0 0 8px #ff6600) drop-shadow(0 0 16px #ff4400); }
.fuse-particle { position: absolute; width: 3px; height: 3px; border-radius: 50%; pointer-events: none; z-index: 9; }
.fuse-trail { position: absolute; bottom: 36px; left: 20px; right: 20px; height: 30px; z-index: 9; pointer-events: none; overflow: visible; }

/* Concept: Strobe */
.strobe-overlay { position: absolute; inset: 0; background: #000; border-radius: 20px; z-index: 25; pointer-events: none; opacity: 0; }

/* Concept: Seismograph */
.seismo-container { position: absolute; bottom: 20px; left: 10px; right: 10px; height: 80px; z-index: 8; pointer-events: none; }
.seismo-canvas { width: 100%; height: 100%; }
.seismo-scale { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 14px; font-weight: 800; color: rgba(124,92,252,0.6); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>

<div class="selector">
  <button class="active" onclick="selectConcept(0)">1. Cardiac</button>
  <button onclick="selectConcept(1)">2. Pressure</button>
  <button onclick="selectConcept(2)">3. Fuse</button>
  <button onclick="selectConcept(3)">4. Blackout</button>
  <button onclick="selectConcept(4)">5. Seismic</button>
</div>

<div class="concept-info" id="info"></div>
<div class="outcome-btns">
  <button class="active" onclick="setOutcome('win')">WIN (fast)</button>
  <button onclick="setOutcome('close-win')">CLOSE WIN</button>
  <button onclick="setOutcome('loss')">LOSS</button>
</div>
<div class="stage-wrap"><div class="stage" id="stage"></div></div>
<button class="replay-btn" onclick="play()">▶ Replay</button>

<script>
let currentConcept = 0;
let currentOutcome = 'win';
let timers = [];
let intervals = [];

const concepts = [
  {
    name: "Cardiac Monitor",
    desc: "ECG flatline runs across the bottom. Each bar tick triggers a heartbeat blip — slow calm beats that accelerate into tachycardia. Screen edges pulse red on every beat. At the climax the heart STOPS — flatline — then the explosion is the defibrillator shock."
  },
  {
    name: "Pressure Cooker",
    desc: "A ring of light tightens around the stage as bars fill. The edges glow orange → red, a PSI counter climbs in the background. The whole stage slowly scales down 2% like it's being crushed. At critical pressure — rupture explosion. The release IS the result."
  },
  {
    name: "Burning Fuse",
    desc: "A lit fuse burns across the bottom of the screen synced to the bars. Sparks fly from the burn point, smoke trails behind. The fuse gets faster as it approaches the end. When it hits the dynamite — BOOM. The explosion comes from the fuse endpoint."
  },
  {
    name: "Blackout Strobe",
    desc: "Screen goes dark. Rapid strobe flashes freeze-frame the bars at increasing intervals — flash, dark, flash, dark — each flash revealing more progress. Between flashes only the time numbers glow in the void. Final flash HOLDS and detonates."
  },
  {
    name: "Seismograph",
    desc: "A live seismograph line draws across the bottom, reacting to the bar race. Starts as gentle tremors, builds to violent spikes. A Richter scale number climbs. When it hits 10.0 the needle goes off-chart and the earthquake becomes the explosion."
  }
];

const outcomes = {
  'win': { myTime: 0.92, oppTime: 3.60, myCorrect: true, oppCorrect: true, myAnswer: 'Owl', oppAnswer: 'Owl' },
  'close-win': { myTime: 1.85, oppTime: 2.01, myCorrect: true, oppCorrect: true, myAnswer: 'Owl', oppAnswer: 'Owl' },
  'loss': { myTime: 3.20, oppTime: 1.15, myCorrect: true, oppCorrect: true, myAnswer: 'Owl', oppAnswer: 'Owl' }
};

function haptic(ms) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

function selectConcept(i) {
  currentConcept = i;
  document.querySelectorAll('.selector button').forEach((b,j) => b.classList.toggle('active', j===i));
  play();
}

function setOutcome(o) {
  currentOutcome = o;
  document.querySelectorAll('.outcome-btns button').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase().includes(o.replace('-',''))));
  play();
}

function t(fn, ms) { const id = setTimeout(fn, ms); timers.push(id); return id; }

function clearAll() {
  timers.forEach(clearTimeout);
  intervals.forEach(clearInterval);
  timers = []; intervals = [];
}

function play() {
  clearAll();
  const info = document.getElementById('info');
  const c = concepts[currentConcept];
  info.innerHTML = `<h2>${c.name}</h2><p>${c.desc}</p>`;

  const stage = document.getElementById('stage');
  stage.innerHTML = '';
  stage.style.transform = '';

  const o = outcomes[currentOutcome];
  const isWin = o.myTime < o.oppTime;

  // Build answer cards
  const answers = document.createElement('div');
  answers.className = 'cr-answers';
  answers.innerHTML = `
    <div class="cr-row cr-you"><div><div class="cr-label">YOU</div><div class="cr-answer" style="color:#22c55e">${o.myAnswer}</div></div><div class="cr-answer" style="color:#333">${o.myTime.toFixed(2)}s</div></div>
    <div class="cr-divider"></div>
    <div class="cr-row cr-opp"><div><div class="cr-label">OPPONENT</div><div class="cr-answer cr-opp-answer">${o.oppAnswer}</div></div><div><span class="cr-opp-status"></span></div></div>
  `;
  stage.appendChild(answers);

  // Build race element
  const race = document.createElement('div');
  race.className = 'cr-race';
  race.innerHTML = `
    <div class="cr-race-row"><div class="cr-race-label">YOU</div><div class="cr-bar-track"><div class="cr-bar-fill cr-bar-you"></div></div><div class="cr-time cr-time-you">0.00s</div></div>
    <div class="cr-race-row"><div class="cr-race-label">OPP</div><div class="cr-bar-track"><div class="cr-bar-fill cr-bar-opp"></div></div><div class="cr-time cr-time-opp">0.00s</div></div>
    <div class="cr-gap"></div>
  `;
  stage.appendChild(race);

  // Animate answer reveal
  const youEl = answers.querySelector('.cr-you');
  const divEl = answers.querySelector('.cr-divider');
  const oppEl = answers.querySelector('.cr-opp');
  const oppReveal = answers.querySelector('.cr-opp-answer');
  const oppStatus = answers.querySelector('.cr-opp-status');

  t(() => { youEl.style.opacity='1'; youEl.style.transform='translateY(0)'; haptic(10); }, 200);
  t(() => { divEl.style.opacity='1'; }, 500);
  t(() => { oppEl.style.opacity='1'; oppEl.style.transform='translateY(0)'; }, 800);
  t(() => {
    oppReveal.style.filter='blur(0)';
    oppReveal.style.color='#22c55e';
    oppStatus.textContent='✓ CORRECT';
    oppStatus.style.color='#22c55e';
    oppStatus.style.opacity='1';
    haptic(20);
  }, 1500);

  // Start time race
  t(() => startRace(stage, answers, race, o), 2400);
}

function startRace(stage, answers, race, o) {
  answers.style.transition = 'all 0.4s cubic-bezier(0,0,0.2,1)';
  answers.style.transform = 'translateX(-50%) translateY(-44px) scale(0.6)';
  answers.style.opacity = '0.2';

  race.style.display = 'block';
  requestAnimationFrame(() => {
    race.style.opacity = '1';
    race.style.transform = 'translateX(-50%) translateY(0)';
  });

  const isWin = o.myTime < o.oppTime;
  const conceptFn = [conceptCardiac, conceptPressure, conceptFuse, conceptBlackout, conceptSeismic][currentConcept];
  conceptFn(stage, race, o, isWin);
}

// ========== CONCEPT 1: CARDIAC MONITOR ==========
function conceptCardiac(stage, race, o, isWin) {
  // ECG line canvas
  const canvas = document.createElement('canvas');
  canvas.className = 'heartbeat-line';
  canvas.width = 380; canvas.height = 60;
  stage.appendChild(canvas);
  const ctx = canvas.getContext('2d');

  // Vignette
  const vig = document.createElement('div');
  vig.className = 'heartbeat-vignette';
  stage.appendChild(vig);

  // Tracking dot
  const dot = document.createElement('div');
  dot.className = 'heartbeat-dot';
  stage.appendChild(dot);

  const t1 = race.querySelector('.cr-time-you');
  const t2 = race.querySelector('.cr-time-opp');
  const bar1 = race.querySelector('.cr-bar-you');
  const bar2 = race.querySelector('.cr-bar-opp');
  const gap = race.querySelector('.cr-gap');

  const maxTime = Math.max(o.myTime, o.oppTime);
  const duration = 2000;
  const step = 20;
  let elapsed = 0;
  let gapShown = false;

  // ECG data
  let ecgX = 0;
  const ecgHistory = [];
  let lastBeat = 0;
  let beatInterval = 600; // start slow — calm heart

  // Draw flatline initially
  ctx.strokeStyle = 'rgba(239,68,68,0.4)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 30);
  ctx.lineTo(380, 30);
  ctx.stroke();

  const ticker = setInterval(() => {
    elapsed += step;
    const progress = Math.min(elapsed / duration, 1);

    // Bar race
    const displayMax = maxTime * progress * 1.1;
    const ct1 = Math.min(displayMax, o.myTime);
    const ct2 = Math.min(displayMax, o.oppTime);
    t1.textContent = ct1.toFixed(2) + 's';
    t2.textContent = ct2.toFixed(2) + 's';
    bar1.style.width = `${(ct1/maxTime)*100}%`;
    bar2.style.width = `${(ct2/maxTime)*100}%`;

    if (!gapShown && ((ct1 >= o.myTime && ct2 < o.oppTime) || (ct2 >= o.oppTime && ct1 < o.myTime))) {
      gap.textContent = `+${Math.abs(o.oppTime - o.myTime).toFixed(2)}s gap`;
      gap.style.opacity = '1'; gapShown = true;
    }

    // Heartbeat — accelerating BPM
    beatInterval = 600 - progress * 480; // 600ms → 120ms (100bpm → 500bpm!)
    const timeSinceLastBeat = elapsed - lastBeat;

    // ECG drawing
    ecgX = (progress * 380);
    ctx.clearRect(0, 0, 380, 60);
    ctx.strokeStyle = `rgba(239,68,68,${0.3 + progress * 0.5})`;
    ctx.lineWidth = 2;
    ctx.beginPath();

    if (timeSinceLastBeat >= beatInterval) {
      lastBeat = elapsed;
      // BEAT! Pulse the vignette
      vig.style.opacity = String(0.3 + progress * 0.7);
      setTimeout(() => { vig.style.opacity = '0'; }, 100);
      haptic(Math.floor(5 + progress * 25));

      // Add heartbeat spike to history
      ecgHistory.push({ x: ecgX, type: 'beat' });

      // Shake on beat
      const shakeAmt = 1 + progress * 6;
      stage.style.transform = `translate(${(Math.random()-0.5)*shakeAmt}px, ${(Math.random()-0.5)*shakeAmt*0.5}px)`;
      setTimeout(() => { if (elapsed < duration) stage.style.transform = ''; }, 80);
    }

    // Draw ECG trace
    for (let x = Math.max(0, ecgX - 300); x <= ecgX; x += 2) {
      const relX = x;
      const isBeat = ecgHistory.some(b => Math.abs(b.x - x) < 8);
      let y = 30;
      if (isBeat) {
        const beatDist = Math.min(...ecgHistory.map(b => Math.abs(b.x - x)));
        const phase = (x - ecgHistory.find(b => Math.abs(b.x - x) < 8).x);
        if (phase < -4) y = 30;
        else if (phase < -2) y = 30 - 8;
        else if (phase < 0) y = 30 + 22;
        else if (phase < 2) y = 30 - 18;
        else if (phase < 4) y = 30 + 4;
        else y = 30;
      }
      if (x === Math.max(0, ecgX - 300)) ctx.moveTo(relX, y);
      else ctx.lineTo(relX, y);
    }
    ctx.stroke();

    // Dot position
    dot.style.left = ecgX + 'px';
    dot.style.bottom = '50px';

    // Shake intensity builds
    if (progress > 0.5) {
      const intensity = Math.pow((progress - 0.5) * 2, 2) * 8;
      const dx = (Math.random()-0.5) * intensity;
      const dy = (Math.random()-0.5) * intensity * 0.4;
      stage.style.transform = `translate(${dx}px, ${dy}px)`;
    }

    if (elapsed >= duration) {
      clearInterval(ticker);

      // FLATLINE moment
      ctx.clearRect(0, 0, 380, 60);
      ctx.strokeStyle = 'rgba(239,68,68,0.8)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 30); ctx.lineTo(380, 30);
      ctx.stroke();
      vig.style.opacity = '0';
      stage.style.transform = '';

      // Color final bars
      if (isWin) {
        t1.style.color='#22c55e'; bar1.style.background='#22c55e';
      } else {
        t2.style.color='#22c55e'; bar2.style.background='#22c55e';
      }

      // Brief flatline pause... then DEFIB SHOCK
      t(() => {
        canvas.remove(); vig.remove(); dot.remove();
        race.remove(); answers?.remove();
        doExplosion(stage, isWin);
      }, 500);
    }
  }, step);
  intervals.push(ticker);
}

// ========== CONCEPT 2: PRESSURE COOKER ==========
function conceptPressure(stage, race, o, isWin) {
  const glow = document.createElement('div');
  glow.className = 'pressure-glow';
  stage.appendChild(glow);

  const psiText = document.createElement('div');
  psiText.className = 'pressure-text';
  psiText.textContent = '0 PSI';
  stage.appendChild(psiText);

  // Tightening ring
  const ring = document.createElement('div');
  ring.style.cssText = 'position:absolute;inset:0;border-radius:20px;pointer-events:none;z-index:6;box-shadow:inset 0 0 0 0 rgba(255,100,0,0);transition:box-shadow 0.1s;';
  stage.appendChild(ring);

  const t1 = race.querySelector('.cr-time-you');
  const t2 = race.querySelector('.cr-time-opp');
  const bar1 = race.querySelector('.cr-bar-you');
  const bar2 = race.querySelector('.cr-bar-opp');
  const gap = race.querySelector('.cr-gap');
  const maxTime = Math.max(o.myTime, o.oppTime);
  const duration = 2000;
  const step = 20;
  let elapsed = 0;
  let gapShown = false;

  const ticker = setInterval(() => {
    elapsed += step;
    const progress = Math.min(elapsed / duration, 1);
    const displayMax = maxTime * progress * 1.1;
    const ct1 = Math.min(displayMax, o.myTime);
    const ct2 = Math.min(displayMax, o.oppTime);
    t1.textContent = ct1.toFixed(2) + 's';
    t2.textContent = ct2.toFixed(2) + 's';
    bar1.style.width = `${(ct1/maxTime)*100}%`;
    bar2.style.width = `${(ct2/maxTime)*100}%`;

    if (!gapShown && ((ct1 >= o.myTime && ct2 < o.oppTime) || (ct2 >= o.oppTime && ct1 < o.myTime))) {
      gap.textContent = `+${Math.abs(o.oppTime - o.myTime).toFixed(2)}s gap`;
      gap.style.opacity = '1'; gapShown = true;
    }

    // Pressure builds
    const psi = Math.floor(Math.pow(progress, 1.5) * 999);
    psiText.textContent = psi + ' PSI';
    psiText.style.color = `rgba(${200 + progress * 55}, ${100 - progress * 80}, 0, ${0.3 + progress * 0.5})`;

    // Glow intensifies
    glow.style.opacity = String(progress * 0.8);
    glow.style.background = `radial-gradient(ellipse at center, transparent ${40 - progress * 30}%, rgba(${Math.floor(255)},${Math.floor(100 - progress*80)},0,${progress * 0.35}) 100%)`;

    // Ring tightens (inset shadow)
    const spread = Math.floor(progress * 25);
    ring.style.boxShadow = `inset 0 0 ${spread * 3}px ${spread}px rgba(255,${Math.floor(100-progress*80)},0,${progress * 0.3})`;

    // Stage compresses
    const scale = 1 - progress * 0.03;
    const shake = progress > 0.3 ? (Math.random()-0.5) * progress * 8 : 0;
    const shakeY = progress > 0.3 ? (Math.random()-0.5) * progress * 3 : 0;
    stage.style.transform = `scale(${scale}) translate(${shake}px, ${shakeY}px)`;

    // Haptic pulses
    if (progress > 0.5 && elapsed % 100 < step) haptic(Math.floor(progress * 20));

    // Warning flashes at high pressure
    if (progress > 0.7 && elapsed % 200 < step) {
      psiText.style.transform = 'translateX(-50%) scale(1.2)';
      setTimeout(() => { psiText.style.transform = 'translateX(-50%) scale(1)'; }, 100);
    }

    if (elapsed >= duration) {
      clearInterval(ticker);
      if (isWin) { t1.style.color='#22c55e'; bar1.style.background='#22c55e'; }
      else { t2.style.color='#22c55e'; bar2.style.background='#22c55e'; }

      // RUPTURE
      psiText.textContent = '999 PSI';
      psiText.style.fontSize = '48px';
      psiText.style.color = 'rgba(239,68,68,0.8)';
      t(() => {
        glow.remove(); psiText.remove(); ring.remove();
        race.remove(); stage.querySelector('.cr-answers')?.remove();
        stage.style.transform = '';
        doExplosion(stage, isWin);
      }, 400);
    }
  }, step);
  intervals.push(ticker);
}

// ========== CONCEPT 3: BURNING FUSE ==========
function conceptFuse(stage, race, o, isWin) {
  const fuseC = document.createElement('div');
  fuseC.className = 'fuse-container';
  const fuseBurn = document.createElement('div');
  fuseBurn.className = 'fuse-burn';
  const spark = document.createElement('div');
  spark.className = 'fuse-spark';
  fuseBurn.appendChild(spark);
  fuseC.appendChild(fuseBurn);
  stage.appendChild(fuseC);

  // Dynamite at the end
  const dynamite = document.createElement('div');
  dynamite.style.cssText = 'position:absolute;bottom:28px;right:14px;font-size:28px;z-index:9;';
  dynamite.textContent = '💥';
  dynamite.style.opacity = '0.6';
  stage.appendChild(dynamite);

  const t1 = race.querySelector('.cr-time-you');
  const t2 = race.querySelector('.cr-time-opp');
  const bar1 = race.querySelector('.cr-bar-you');
  const bar2 = race.querySelector('.cr-bar-opp');
  const gapEl = race.querySelector('.cr-gap');
  const maxTime = Math.max(o.myTime, o.oppTime);
  const duration = 2000;
  const step = 20;
  let elapsed = 0;
  let gapShown = false;

  const ticker = setInterval(() => {
    elapsed += step;
    const progress = Math.min(elapsed / duration, 1);
    const displayMax = maxTime * progress * 1.1;
    const ct1 = Math.min(displayMax, o.myTime);
    const ct2 = Math.min(displayMax, o.oppTime);
    t1.textContent = ct1.toFixed(2) + 's';
    t2.textContent = ct2.toFixed(2) + 's';
    bar1.style.width = `${(ct1/maxTime)*100}%`;
    bar2.style.width = `${(ct2/maxTime)*100}%`;

    if (!gapShown && ((ct1 >= o.myTime && ct2 < o.oppTime) || (ct2 >= o.oppTime && ct1 < o.myTime))) {
      gapEl.textContent = `+${Math.abs(o.oppTime - o.myTime).toFixed(2)}s gap`;
      gapEl.style.opacity = '1'; gapShown = true;
    }

    // Fuse burns
    fuseBurn.style.width = `${progress * 100}%`;

    // Spark particles
    if (elapsed % 60 < step) {
      const particle = document.createElement('div');
      particle.className = 'fuse-particle';
      const sparkX = 20 + (progress * (380 - 40));
      particle.style.cssText = `
        position:absolute;bottom:${38 + Math.random()*20}px;left:${sparkX}px;
        width:${2+Math.random()*3}px;height:${2+Math.random()*3}px;
        background:${Math.random()>0.5?'#ffaa00':'#ff6600'};border-radius:50%;
        z-index:10;opacity:1;transition:all ${0.3+Math.random()*0.3}s ease-out;
      `;
      stage.appendChild(particle);
      requestAnimationFrame(() => {
        particle.style.transform = `translate(${(Math.random()-0.5)*30}px, ${-20-Math.random()*30}px)`;
        particle.style.opacity = '0';
      });
      setTimeout(() => particle.remove(), 600);
    }

    // Smoke trail (subtle dark particles behind)
    if (elapsed % 100 < step && progress > 0.1) {
      const smoke = document.createElement('div');
      const smokeX = 20 + ((progress - 0.05) * (380 - 40));
      smoke.style.cssText = `
        position:absolute;bottom:${40+Math.random()*10}px;left:${smokeX}px;
        width:${6+Math.random()*8}px;height:${6+Math.random()*8}px;
        background:rgba(0,0,0,0.1);border-radius:50%;z-index:7;
        transition:all 0.8s ease-out;
      `;
      stage.appendChild(smoke);
      requestAnimationFrame(() => {
        smoke.style.transform = `translateY(${-15-Math.random()*20}px)`;
        smoke.style.opacity = '0';
      });
      setTimeout(() => smoke.remove(), 1000);
    }

    // Shake builds
    const intensity = 1 + Math.pow(progress, 2) * 10;
    const dx = (Math.random()-0.5) * intensity;
    const dy = (Math.random()-0.5) * intensity * 0.3;
    stage.style.transform = `translate(${dx}px, ${dy}px)`;
    if (progress > 0.6) haptic(5);

    // Dynamite gets more nervous
    if (progress > 0.7) {
      dynamite.style.transform = `rotate(${(Math.random()-0.5)*20}deg)`;
      dynamite.style.opacity = '1';
    }

    if (elapsed >= duration) {
      clearInterval(ticker);
      if (isWin) { t1.style.color='#22c55e'; bar1.style.background='#22c55e'; }
      else { t2.style.color='#22c55e'; bar2.style.background='#22c55e'; }

      dynamite.style.fontSize = '48px';
      haptic(50);

      t(() => {
        fuseC.remove(); dynamite.remove();
        race.remove(); stage.querySelector('.cr-answers')?.remove();
        stage.style.transform = '';
        doExplosion(stage, isWin);
      }, 400);
    }
  }, step);
  intervals.push(ticker);
}

// ========== CONCEPT 4: BLACKOUT STROBE ==========
function conceptBlackout(stage, race, o, isWin) {
  const overlay = document.createElement('div');
  overlay.className = 'strobe-overlay';
  overlay.style.opacity = '1';
  stage.appendChild(overlay);

  // Glowing numbers in the dark
  const glowNum = document.createElement('div');
  glowNum.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:72px;font-weight:900;color:rgba(124,92,252,0.8);z-index:30;text-shadow:0 0 30px rgba(124,92,252,0.6);opacity:0;transition:all 0.15s;';
  stage.appendChild(glowNum);

  const t1 = race.querySelector('.cr-time-you');
  const t2 = race.querySelector('.cr-time-opp');
  const bar1 = race.querySelector('.cr-bar-you');
  const bar2 = race.querySelector('.cr-bar-opp');
  const gapEl = race.querySelector('.cr-gap');
  const maxTime = Math.max(o.myTime, o.oppTime);
  const duration = 2000;
  const step = 20;
  let elapsed = 0;
  let gapShown = false;
  let lastFlash = 0;
  let flashInterval = 400; // slow at start

  const ticker = setInterval(() => {
    elapsed += step;
    const progress = Math.min(elapsed / duration, 1);
    const displayMax = maxTime * progress * 1.1;
    const ct1 = Math.min(displayMax, o.myTime);
    const ct2 = Math.min(displayMax, o.oppTime);
    t1.textContent = ct1.toFixed(2) + 's';
    t2.textContent = ct2.toFixed(2) + 's';
    bar1.style.width = `${(ct1/maxTime)*100}%`;
    bar2.style.width = `${(ct2/maxTime)*100}%`;

    if (!gapShown && ((ct1 >= o.myTime && ct2 < o.oppTime) || (ct2 >= o.oppTime && ct1 < o.myTime))) {
      gapEl.textContent = `+${Math.abs(o.oppTime - o.myTime).toFixed(2)}s gap`;
      gapEl.style.opacity = '1'; gapShown = true;
    }

    // Flash interval accelerates
    flashInterval = 400 - progress * 330; // 400ms → 70ms
    const timeSinceFlash = elapsed - lastFlash;

    // Strobe logic
    if (timeSinceFlash >= flashInterval) {
      lastFlash = elapsed;
      // FLASH — reveal bars
      overlay.style.opacity = '0';
      haptic(Math.floor(5 + progress * 15));

      // Show time in the glow
      const faster = ct1 < ct2 ? ct1 : ct2;
      glowNum.textContent = faster.toFixed(1) + 's';
      glowNum.style.opacity = '0';

      // Quick blackout return
      const flashDur = 60 + progress * 60; // longer flashes as we go
      setTimeout(() => {
        if (elapsed < duration - 100) {
          overlay.style.opacity = '0.92';
          // Show number in the dark
          glowNum.style.opacity = '1';
          glowNum.style.fontSize = `${48 + progress * 36}px`;
        }
      }, flashDur);
    }

    // Shake during flashes
    if (progress > 0.3) {
      const intensity = Math.pow(progress, 2) * 10;
      stage.style.transform = `translate(${(Math.random()-0.5)*intensity}px, ${(Math.random()-0.5)*intensity*0.3}px)`;
    }

    if (elapsed >= duration) {
      clearInterval(ticker);
      // Final flash HOLDS
      overlay.style.opacity = '0';
      glowNum.style.opacity = '0';

      if (isWin) { t1.style.color='#22c55e'; bar1.style.background='#22c55e'; }
      else { t2.style.color='#22c55e'; bar2.style.background='#22c55e'; }

      haptic(50);
      t(() => {
        overlay.remove(); glowNum.remove();
        race.remove(); stage.querySelector('.cr-answers')?.remove();
        stage.style.transform = '';
        doExplosion(stage, isWin);
      }, 500);
    }
  }, step);
  intervals.push(ticker);
}

// ========== CONCEPT 5: SEISMOGRAPH ==========
function conceptSeismic(stage, race, o, isWin) {
  const container = document.createElement('div');
  container.className = 'seismo-container';
  const canvas = document.createElement('canvas');
  canvas.className = 'seismo-canvas';
  canvas.width = 360; canvas.height = 80;
  container.appendChild(canvas);

  const scaleText = document.createElement('div');
  scaleText.className = 'seismo-scale';
  scaleText.textContent = 'MAG 0.0';
  container.appendChild(scaleText);
  stage.appendChild(container);

  const ctx = canvas.getContext('2d');

  // Crack overlay
  const cracks = document.createElement('div');
  cracks.style.cssText = 'position:absolute;inset:0;border-radius:20px;pointer-events:none;z-index:6;opacity:0;transition:opacity 0.3s;';
  stage.appendChild(cracks);

  const t1 = race.querySelector('.cr-time-you');
  const t2 = race.querySelector('.cr-time-opp');
  const bar1 = race.querySelector('.cr-bar-you');
  const bar2 = race.querySelector('.cr-bar-opp');
  const gapEl = race.querySelector('.cr-gap');
  const maxTime = Math.max(o.myTime, o.oppTime);
  const duration = 2000;
  const step = 20;
  let elapsed = 0;
  let gapShown = false;
  const seismoData = [];

  const ticker = setInterval(() => {
    elapsed += step;
    const progress = Math.min(elapsed / duration, 1);
    const displayMax = maxTime * progress * 1.1;
    const ct1 = Math.min(displayMax, o.myTime);
    const ct2 = Math.min(displayMax, o.oppTime);
    t1.textContent = ct1.toFixed(2) + 's';
    t2.textContent = ct2.toFixed(2) + 's';
    bar1.style.width = `${(ct1/maxTime)*100}%`;
    bar2.style.width = `${(ct2/maxTime)*100}%`;

    if (!gapShown && ((ct1 >= o.myTime && ct2 < o.oppTime) || (ct2 >= o.oppTime && ct1 < o.myTime))) {
      gapEl.textContent = `+${Math.abs(o.oppTime - o.myTime).toFixed(2)}s gap`;
      gapEl.style.opacity = '1'; gapShown = true;
    }

    // Seismograph — amplitude increases with progress
    const baseAmplitude = 2 + Math.pow(progress, 2) * 35;
    const frequency = 0.3 + progress * 0.5;
    const noise = (Math.random() - 0.5) * baseAmplitude;
    const wave = Math.sin(elapsed * frequency * 0.01) * baseAmplitude * 0.3;
    const spike = Math.random() < (progress * 0.15) ? (Math.random()-0.5) * baseAmplitude * 2 : 0;
    seismoData.push(40 + noise + wave + spike);
    if (seismoData.length > 180) seismoData.shift();

    // Draw seismograph
    ctx.clearRect(0, 0, 360, 80);
    ctx.strokeStyle = `rgba(124,92,252,${0.4 + progress * 0.5})`;
    ctx.lineWidth = progress > 0.7 ? 3 : 2;
    ctx.beginPath();
    seismoData.forEach((y, i) => {
      const x = (i / 180) * 360;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Red zone highlight when violent
    if (progress > 0.6) {
      ctx.fillStyle = `rgba(239,68,68,${(progress-0.6)*0.15})`;
      ctx.fillRect(0, 0, 360, 80);
    }

    // Magnitude
    const mag = Math.min(progress * 12, 10).toFixed(1);
    scaleText.textContent = `MAG ${mag}`;
    scaleText.style.color = progress > 0.7 ? `rgba(239,68,68,${0.5+progress*0.4})` : `rgba(124,92,252,${0.4+progress*0.4})`;

    // Shake — seismic!
    const intensity = 2 + Math.pow(progress, 1.5) * 14;
    const dx = (Math.random()-0.5) * intensity;
    const dy = (Math.random()-0.5) * intensity * 0.5;
    const rot = (Math.random()-0.5) * intensity * 0.1;
    stage.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
    if (progress > 0.4) haptic(Math.floor(progress * 15));

    // Cracks appear at high magnitude
    if (progress > 0.6) {
      cracks.style.opacity = String((progress - 0.6) * 2.5);
      const crackShadow = `inset ${(Math.random()-0.5)*40}px ${(Math.random()-0.5)*20}px ${10+progress*20}px rgba(0,0,0,${progress*0.15})`;
      cracks.style.boxShadow = crackShadow;
    }

    if (elapsed >= duration) {
      clearInterval(ticker);
      if (isWin) { t1.style.color='#22c55e'; bar1.style.background='#22c55e'; }
      else { t2.style.color='#22c55e'; bar2.style.background='#22c55e'; }

      scaleText.textContent = 'MAG 10.0';
      scaleText.style.color = 'rgba(239,68,68,0.9)';
      scaleText.style.fontSize = '20px';

      t(() => {
        container.remove(); cracks.remove();
        race.remove(); stage.querySelector('.cr-answers')?.remove();
        stage.style.transform = '';
        doExplosion(stage, isWin);
      }, 400);
    }
  }, step);
  intervals.push(ticker);
}

// ========== SHARED EXPLOSION ==========
function doExplosion(stage, isWin) {
  const resultColor = isWin ? '#22c55e' : '#ef4444';
  const bannerTexts = isWin ? ["LET'S GO","EASY MONEY","TOO FAST","WRECKED","DOMINATED"] : ["GOT COOKED","DESTROYED","OOF","TOUGH LUCK","SMOKED"];
  const bannerText = bannerTexts[Math.floor(Math.random()*bannerTexts.length)];

  // Flash
  const flash = document.createElement('div');
  flash.className = 'cr-flash';
  flash.style.background = isWin ? 'rgba(34,197,94,0.35)' : 'rgba(239,68,68,0.3)';
  stage.appendChild(flash);
  requestAnimationFrame(() => flash.classList.add('cr-flash-go'));

  // Shockwaves
  const colors = isWin ? ['rgba(34,197,94,0.5)','rgba(124,92,252,0.4)','rgba(245,158,11,0.3)'] : ['rgba(239,68,68,0.5)','rgba(124,92,252,0.3)'];
  colors.forEach((c, i) => {
    t(() => {
      const s = document.createElement('div');
      s.className = 'cr-shockwave';
      s.style.borderColor = c;
      stage.appendChild(s);
      requestAnimationFrame(() => s.classList.add('cr-sw-go'));
    }, i * 100);
  });

  // Confetti
  const count = isWin ? 60 : 15;
  const confColors = isWin ? ['#22c55e','#7c5cfc','#f59e0b','#ec4899','#06b6d4','#fff'] : ['#ef4444','#666','#999'];
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'cr-confetti';
    const size = 4 + Math.random() * 8;
    p.style.cssText = `width:${size}px;height:${size*0.6}px;background:${confColors[Math.floor(Math.random()*confColors.length)]};left:${40+Math.random()*20}%;top:${30+Math.random()*20}%;--dx:${(Math.random()-0.5)*280}px;--dy:${-(100+Math.random()*220)}px;--rot:${Math.random()*540}deg;border-radius:${Math.random()>0.4?'1px':'50%'};`;
    stage.appendChild(p);
    requestAnimationFrame(() => p.classList.add('cr-pop'));
  }

  haptic(50);

  // Banner + results
  t(() => {
    const finalBlock = document.createElement('div');
    finalBlock.style.cssText = 'position:relative;z-index:10;text-align:center;width:100%;';

    const banner = document.createElement('div');
    banner.style.cssText = `font-size:28px;font-weight:900;letter-spacing:2px;color:${resultColor};transform:translateY(30px) scale(1.3);opacity:0;transition:all 0.35s cubic-bezier(0.34,1.56,0.64,1);`;
    banner.textContent = bannerText;
    finalBlock.appendChild(banner);

    const sub = document.createElement('div');
    sub.style.cssText = `font-size:22px;font-weight:800;color:#333;margin-top:4px;opacity:0;transform:translateY(10px);transition:all 0.3s ease 0.15s;`;
    sub.textContent = isWin ? '✅ Correct' : '❌ Wrong';
    finalBlock.appendChild(sub);

    stage.appendChild(finalBlock);

    requestAnimationFrame(() => {
      banner.style.transform = 'translateY(0) scale(1)';
      banner.style.opacity = '1';
      sub.style.opacity = '1';
      sub.style.transform = 'translateY(0)';
    });
    haptic(30);
  }, 180);
}

play();
