<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sense — Timing Debug Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #e0e0e0; padding: 20px; }
h1 { font-size: 18px; color: #fff; margin-bottom: 4px; }
.subtitle { color: #888; font-size: 13px; margin-bottom: 16px; }
.controls { display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
.controls select, .controls button { background: #1a1a2e; border: 1px solid #333; color: #e0e0e0; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }
.controls button { background: #7c3aed; border-color: #7c3aed; color: #fff; }
.controls button:hover { background: #6d28d9; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.badge-ok { background: #166534; color: #4ade80; }
.badge-warn { background: #713f12; color: #fbbf24; }
.badge-fail { background: #7f1d1d; color: #f87171; }
.badge-server { background: #1e3a5f; color: #60a5fa; font-size: 12px; margin-left: 8px; }
.stat-row { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.stat-card { background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 8px; padding: 12px 16px; min-width: 140px; }
.stat-card .label { font-size: 11px; color: #888; text-transform: uppercase; }
.stat-card .value { font-size: 22px; font-weight: 700; color: #fff; margin-top: 2px; }
.game-card { background: #1a1a2e; border: 1px solid #2a2a3e; border-radius: 8px; margin-bottom: 10px; overflow: hidden; }
.game-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: #12121e; border-bottom: 1px solid #2a2a3e; }
.game-header .match-id { font-family: monospace; font-size: 12px; color: #888; }
.game-header .timestamp { font-size: 12px; color: #666; }
.game-body { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0; }
.player-col { padding: 12px 14px; }
.player-col.winner { background: rgba(74, 222, 128, 0.05); }
.player-col.loser { background: rgba(248, 113, 113, 0.03); }
.player-name { font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.player-name .result-tag { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; margin-left: 6px; }
.result-win { background: #166534; color: #4ade80; }
.result-loss { background: #7f1d1d; color: #f87171; }
.result-draw { background: #713f12; color: #fbbf24; }
.timing-row { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; }
.timing-row .lbl { color: #888; }
.timing-row .val { font-family: monospace; color: #e0e0e0; }
.timing-row .val.highlight { color: #fbbf24; font-weight: 600; }
.vs-col { display: flex; align-items: center; justify-content: center; padding: 0 8px; color: #555; font-size: 12px; font-weight: 700; border-left: 1px solid #2a2a3e; border-right: 1px solid #2a2a3e; }
.game-footer { padding: 6px 14px; background: #0f0f1a; border-top: 1px solid #2a2a3e; display: flex; justify-content: space-between; font-size: 11px; color: #888; }
.consistency-ok { color: #4ade80; }
.consistency-fail { color: #f87171; font-weight: 700; }
.empty { text-align: center; padding: 60px 20px; color: #555; }
.empty h2 { font-size: 16px; color: #888; margin-bottom: 8px; }
.auto-refresh { font-size: 12px; color: #666; }
@media (max-width: 600px) {
  .game-body { grid-template-columns: 1fr; }
  .vs-col { padding: 4px; border-left: none; border-right: none; border-top: 1px solid #2a2a3e; border-bottom: 1px solid #2a2a3e; }
}
</style>
</head>
<body>

<h1>Timing Debug Dashboard <span class="badge badge-server" id="serverBadge">connecting...</span></h1>
<p class="subtitle">Last 50 settled games — full timing breakdown per player</p>

<div class="controls">
  <select id="serverSelect">
    <option value="https://web-production-c6ec6.up.railway.app">Preview Server</option>
    <option value="https://web-production-8866e.up.railway.app">Devnet Server</option>
  </select>
  <button onclick="fetchData()">Refresh</button>
  <label style="font-size:12px;color:#888;display:flex;align-items:center;gap:4px;">
    <input type="checkbox" id="autoRefresh" checked> Auto-refresh 10s
  </label>
  <span class="auto-refresh" id="lastUpdate"></span>
</div>

<div class="stat-row" id="stats"></div>
<div id="games"></div>

<script>
const SERVER_SELECT = document.getElementById('serverSelect');
const GAMES_DIV = document.getElementById('games');
const STATS_DIV = document.getElementById('stats');

// Auto-detect server from URL params
const params = new URLSearchParams(location.search);
if (params.get('mode') === 'devnet') {
  SERVER_SELECT.value = 'https://web-production-8866e.up.railway.app';
}

function fmt(ms) {
  if (ms == null || ms === undefined) return '—';
  return (ms / 1000).toFixed(2) + 's';
}

function fmtRTT(ms) {
  if (!ms) return '0ms';
  return Math.round(ms) + 'ms';
}

function timeAgo(ts) {
  const diff = Date.now() - new Date(ts).getTime();
  if (diff < 60000) return Math.round(diff / 1000) + 's ago';
  if (diff < 3600000) return Math.round(diff / 60000) + 'm ago';
  if (diff < 86400000) return Math.round(diff / 3600000) + 'h ago';
  return Math.round(diff / 86400000) + 'd ago';
}

function resultTag(r) {
  const cls = r === 'win' ? 'result-win' : r === 'loss' ? 'result-loss' : 'result-draw';
  return `<span class="result-tag ${cls}">${r.toUpperCase()}</span>`;
}

function renderPlayer(p) {
  return `
    <div class="player-col ${p.result === 'win' ? 'winner' : p.result === 'loss' ? 'loser' : ''}">
      <div class="player-name">${p.name} ${resultTag(p.result)}</div>
      <div class="timing-row"><span class="lbl">Display time</span><span class="val highlight">${fmt(p.displayTime)}</span></div>
      <div class="timing-row"><span class="lbl">Raw server</span><span class="val">${fmt(p.rawServer)}</span></div>
      <div class="timing-row"><span class="lbl">Adjusted (−countdown −RTT)</span><span class="val">${fmt(p.adjusted)}</span></div>
      <div class="timing-row"><span class="lbl">RTT</span><span class="val">${fmtRTT(p.rtt)}</span></div>
    </div>`;
}

function renderGame(g) {
  const consistent = g.displayConsistent;
  const consistentHTML = consistent
    ? '<span class="consistency-ok">✓ Display consistent with winner</span>'
    : '<span class="consistency-fail">✗ DISPLAY CONTRADICTS WINNER</span>';

  return `
    <div class="game-card">
      <div class="game-header">
        <span class="match-id">${g.matchId}</span>
        <span class="timestamp">${timeAgo(g.timestamp)}</span>
      </div>
      <div class="game-body">
        ${renderPlayer(g.playerA)}
        <div class="vs-col">VS</div>
        ${renderPlayer(g.playerB)}
      </div>
      <div class="game-footer">
        <span>Reason: <strong>${g.reason}</strong></span>
        <span>Raw winner: ${g.winnerByRaw}</span>
        ${consistentHTML}
      </div>
    </div>`;
}

function renderStats(games) {
  if (!games.length) { STATS_DIV.innerHTML = ''; return; }
  const total = games.length;
  const consistent = games.filter(g => g.displayConsistent).length;
  const inconsistent = total - consistent;
  const avgRTT = games.reduce((s, g) => s + (g.playerA.rtt + g.playerB.rtt) / 2, 0) / total;
  const maxRTT = Math.max(...games.flatMap(g => [g.playerA.rtt, g.playerB.rtt]));
  const fasterWins = games.filter(g => g.reason === 'faster').length;

  STATS_DIV.innerHTML = `
    <div class="stat-card"><div class="label">Games</div><div class="value">${total}</div></div>
    <div class="stat-card"><div class="label">Consistent</div><div class="value" style="color:${inconsistent ? '#f87171' : '#4ade80'}">${consistent}/${total}</div></div>
    <div class="stat-card"><div class="label">Avg RTT</div><div class="value">${Math.round(avgRTT)}ms</div></div>
    <div class="stat-card"><div class="label">Max RTT</div><div class="value">${Math.round(maxRTT)}ms</div></div>
    <div class="stat-card"><div class="label">Speed Wins</div><div class="value">${fasterWins}</div></div>
  `;
}

async function fetchData() {
  const server = SERVER_SELECT.value;
  document.getElementById('serverBadge').textContent = server.includes('8866e') ? 'devnet' : 'preview';
  try {
    const res = await fetch(server + '/api/timing-log');
    const data = await res.json();
    if (!data.games || !data.games.length) {
      GAMES_DIV.innerHTML = '<div class="empty"><h2>No timing data yet</h2><p>Play a game and it will appear here</p></div>';
      STATS_DIV.innerHTML = '';
    } else {
      renderStats(data.games);
      GAMES_DIV.innerHTML = data.games.map(renderGame).join('');
    }
    document.getElementById('lastUpdate').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch (e) {
    GAMES_DIV.innerHTML = `<div class="empty"><h2>Connection error</h2><p>${e.message}</p></div>`;
  }
}

fetchData();
setInterval(() => {
  if (document.getElementById('autoRefresh').checked) fetchData();
}, 10000);
</script>
</body>
</html>
