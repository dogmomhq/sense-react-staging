<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Question Screen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --accent: #6C63FF;
    --text-primary: #1A1A2E;
    --text-secondary: #6B7B94;
    --win: #22C55E;
    --lose: #EF4444;
    --draw: #F59E0B;
  }
  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--text-primary);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 430px;
    margin: 0 auto;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }
  .bg-image {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
  }
  .bg-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* === Play Header === */
  .play-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 20px;
    z-index: 2;
    position: relative;
  }
  .player-name {
    font-weight: 700;
    font-size: 15px;
    color: var(--text-primary);
  }
  .vs-text {
    font-weight: 800;
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 2px;
  }

  /* === Timer === */
  .timer-container {
    position: relative;
    width: 100px;
    height: 100px;
    margin: 8px auto;
    z-index: 1;
  }
  .timer-svg { width: 100%; height: 100%; }
  .timer-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
  }

  /* === Question Card === */
  .question-card {
    margin: 8px 16px;
    background: #FFFFFF;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    z-index: 1;
    position: relative;
  }
  .question-image {
    width: 100%;
    height: 160px;
    object-fit: cover;
    display: block;
  }
  .question-text {
    padding: 14px 16px;
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    color: var(--text-primary);
  }

  /* === Elapsed Timer === */
  .elapsed-timer {
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    color: var(--text-secondary);
    padding: 4px 0;
    z-index: 1;
    position: relative;
  }

  /* === Answer Grid === */
  .answer-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 8px 16px;
    z-index: 1;
    position: relative;
  }
  .answer-btn {
    padding: 14px 8px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
    background: #FFFFFF;
    color: var(--text-primary);
    border: 2px solid rgba(0,0,0,0.08);
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .answer-btn.selected {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .answer-btn.correct {
    background: var(--win);
    color: #fff;
    border-color: var(--win);
  }
  .answer-btn.wrong {
    background: var(--lose);
    color: #fff;
    border-color: var(--lose);
  }

  /* === Time Display === */
  .time-display {
    padding: 8px 20px;
    z-index: 1;
    position: relative;
  }
  .time-row {
    display: flex;
    justify-content: space-between;
    padding: 3px 0;
  }
  .time-label { font-size: 13px; color: var(--text-secondary); font-weight: 500; }
  .time-value { font-size: 13px; font-weight: 700; color: var(--text-primary); }

  /* === Waiting === */
  .waiting-message {
    text-align: center;
    font-size: 13px;
    color: var(--text-secondary);
    padding: 8px 0;
    z-index: 1;
    position: relative;
    font-weight: 500;
  }

  /* === Bottom Nav === */
  .bottom-nav {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 10px 0 18px;
    background: #FFFFFF;
    border-top: 1px solid rgba(0,0,0,0.06);
    z-index: 2;
    position: relative;
    flex-shrink: 0;
    margin-top: auto;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    cursor: pointer;
    flex: 1;
    color: #2A2A2A;
  }
  .nav-item.active { color: #2A2A2A; }
  .nav-icon { width: 24px; height: 24px; }
  .nav-label { font-size: 10px; font-weight: 700; letter-spacing: 0.2px; }

  @supports (padding-top: env(safe-area-inset-top)) {
    .play-header { padding-top: calc(env(safe-area-inset-top) + 6px); }
    .bottom-nav { padding-bottom: calc(env(safe-area-inset-bottom) + 8px); }
  }
</style>
</head>
<body>
<div class="app">
  <div class="bg-image"><img src="assets/background.jpg" alt=""></div>

  <!-- Header: You vs Opponent -->
  <div class="play-header">
    <div class="player-name">FastLynx69</div>
    <div class="vs-text">VS</div>
    <div class="player-name">SharpOwl42</div>
  </div>

  <!-- Timer Ring -->
  <div class="timer-container">
    <svg class="timer-svg" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="6"/>
      <circle cx="60" cy="60" r="54" fill="none" stroke="#6C63FF" stroke-width="6"
        stroke-dasharray="339.3" stroke-dashoffset="85" stroke-linecap="round"
        transform="rotate(-90 60 60)"/>
    </svg>
    <div class="timer-text">7.42</div>
  </div>

  <!-- Question Card -->
  <div class="question-card">
    <img class="question-image" src="https://images.unsplash.com/photo-1474511320723-9a56873571b7?w=600&q=80" alt="Animal">
    <div class="question-text">What animal is this?</div>
  </div>

  <div class="elapsed-timer">2.58s</div>

  <!-- Answer Buttons -->
  <div class="answer-grid">
    <button class="answer-btn">Red Fox</button>
    <button class="answer-btn selected">Gray Wolf</button>
    <button class="answer-btn">Coyote</button>
    <button class="answer-btn">Arctic Fox</button>
  </div>

  <!-- Times -->
  <div class="time-display">
    <div class="time-row">
      <span class="time-label">Your time:</span>
      <span class="time-value">2.58s</span>
    </div>
    <div class="time-row">
      <span class="time-label">Their time:</span>
      <span class="time-value">—</span>
    </div>
  </div>

  <div class="waiting-message">Answer submitted — waiting for opponent...</div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item active">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      <span class="nav-label">Play</span>
    </div>
    <div class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="2" y="7" width="7" height="13" rx="1"/><rect x="15" y="3" width="7" height="17" rx="1"/><path d="M9 14h6"/><path d="M9 10h6"/></svg>
      <span class="nav-label">Challenge</span>
    </div>
    <div class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span class="nav-label">Profile</span>
    </div>
    <div class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="nav-label">Hosts</span>
    </div>
    <div class="nav-item">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span class="nav-label">History</span>
    </div>
  </div>
</div>
</body>
</html>
